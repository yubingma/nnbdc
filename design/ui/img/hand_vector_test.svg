<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" width="520" height="650">
  <defs>
    <!-- 皮肤主渐变：暖润象牙白至柔粉肤色 -->
    <linearGradient id="skinBase" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FFF6F2"/>
      <stop offset="20%" stop-color="#FDEDE5"/>
      <stop offset="50%" stop-color="#F8DDD0"/>
      <stop offset="75%" stop-color="#ECC4B0"/>
      <stop offset="100%" stop-color="#DFAC95"/>
    </linearGradient>

    <!-- 食指背光阴影渐变 -->
    <linearGradient id="indexShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E3A790" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ECC4B0" stop-opacity="0"/>
    </linearGradient>

    <!-- 拇指阴影渐变 -->
    <linearGradient id="thumbGrad" x1="0.1" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FFF4EE"/>
      <stop offset="35%" stop-color="#FCECE3"/>
      <stop offset="70%" stop-color="#ECC6B2"/>
      <stop offset="100%" stop-color="#DFAC95"/>
    </linearGradient>

    <!-- 虎口深层阴影 -->
    <radialGradient id="purlicueShadow" cx="42%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#C8856C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#DFAC95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ECC4B0" stop-opacity="0"/>
    </radialGradient>

    <!-- 指甲渐变：优雅健康晶莹粉 -->
    <linearGradient id="nailGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#FFF0F2"/>
      <stop offset="55%" stop-color="#FBCED5"/>
      <stop offset="100%" stop-color="#F5ADB9"/>
    </linearGradient>

    <!-- 指尖透光红晕 -->
    <radialGradient id="fingertipFlush" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F87171" stop-opacity="0"/>
    </radialGradient>

    <!-- 手背肌腱柔和高光 -->
    <linearGradient id="tendonHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 整体手部投影 -->
    <filter id="handShadow" x="-15%" y="-10%" width="135%" height="130%">
      <feDropShadow dx="-8" dy="14" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#handShadow)">
    <!-- 手掌与食指主体轮廓 -->
    <!-- 食指尖在 (60, 28) -->
    <path d="M 60 28
             C 46 32, 41 46, 42 62
             C 43 82, 53 118, 70 156
             C 86 192, 108 234, 134 274
             C 142 288, 146 304, 148 322
             C 152 355, 156 395, 162 430
             C 168 460, 185 490, 210 520
             C 245 560, 290 605, 340 648
             L 516 648
             L 516 430
             C 512 400, 506 380, 480 365
             C 455 352, 425 350, 400 355
             C 380 340, 350 328, 318 335
             C 285 315, 250 260, 215 200
             C 180 142, 148 95, 122 66
             C 102 44, 82 25, 60 28 Z"
          fill="url(#skinBase)"/>

    <!-- 拇指轮廓与大鱼际 (从虎口延伸至左侧 (6, 307)) -->
    <path d="M 148 322
             C 120 330, 85 320, 50 312
             C 25 306, 8 302, 6 312
             C 4 324, 15 348, 28 375
             C 45 410, 72 455, 105 495
             C 140 535, 180 575, 225 615
             C 200 570, 180 520, 168 470
             C 158 425, 152 375, 150 335
             Z"
          fill="url(#thumbGrad)"/>

    <!-- 虎口深层环境光阴影遮罩 -->
    <path d="M 148 322
             C 130 340, 122 370, 125 405
             C 128 440, 142 475, 160 505
             C 150 465, 145 425, 145 385
             C 145 355, 146 335, 148 322 Z"
          fill="url(#purlicueShadow)"/>

    <!-- 食指内侧修长阴影折痕（增强圆润立体感） -->
    <path d="M 48 55
             C 50 95, 68 150, 92 205
             C 112 250, 134 290, 148 322"
          stroke="url(#indexShadow)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- 食指背部高光线（纤细柔美骨感） -->
    <path d="M 75 42
             C 98 75, 128 130, 158 185
             C 188 238, 218 285, 235 315"
          stroke="url(#tendonHighlight)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 食指指尖温润红晕（透光生动感） -->
    <ellipse cx="58" cy="48" rx="16" ry="22" transform="rotate(-28 58 48)" fill="url(#fingertipFlush)"/>

    <!-- 食指指甲盖（粉嫩优雅、晶莹高光） -->
    <!-- 按照照片中修长的椭圆修剪指甲设计 -->
    <path d="M 60 30
             C 52 32, 47 38, 48 48
             C 49 60, 56 72, 64 72
             C 72 72, 78 58, 76 44
             C 74 34, 68 28, 60 30 Z"
          fill="url(#nailGrad)" stroke="#F8B4C0" stroke-width="0.8"/>
    <!-- 指甲月牙白边缘（顶部透亮光感） -->
    <path d="M 50 44 C 54 35, 66 31, 72 36" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95"/>
    <!-- 指甲表面反光侧高光弧线 -->
    <path d="M 53 48 C 55 56, 60 66, 64 68" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- 拇指指甲（侧视修长弧线） -->
    <path d="M 7 312
             C 8 304, 18 305, 25 310
             C 30 314, 28 326, 20 330
             C 13 333, 7 325, 7 312 Z"
          fill="url(#nailGrad)" stroke="#F8B4C0" stroke-width="0.6"/>
    <path d="M 8 310 C 13 306, 20 307, 24 311" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- 手背肌腱骨节微妙高光与隆起（真实解剖结构） -->
    <path d="M 215 200 C 255 255, 305 315, 335 365" stroke="url(#tendonHighlight)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 265 290 C 310 335, 360 385, 395 435" stroke="url(#tendonHighlight)" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- 右侧其余手指蜷握的自然弧线与关节阴影 -->
    <path d="M 318 335 C 340 338, 360 350, 368 368" stroke="#D89A80" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 400 355 C 425 360, 445 375, 452 395" stroke="#D89A80" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 480 365 C 495 375, 508 395, 512 418" stroke="#D89A80" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- 皮肤细腻折痕与微细节 -->
    <path d="M 95 145 C 105 148, 115 146, 120 142" stroke="#C8856C" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
    <path d="M 145 230 C 158 234, 170 230, 178 225" stroke="#C8856C" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>