<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>背单词 - 浅色雾霭玉绿微光原型</title>
  <style>
    :root {
      /* 浅色主题 - 雾霭冷玉绿微光体系 (Misty Sage Glow) */
      --app-bg-gradient: radial-gradient(circle at 50% 12%, rgba(204, 226, 219, 0.85) 0%, rgba(214, 230, 225, 0.6) 38%, #D3DFDC 75%, #CBD6D2 100%);
      --ambient-glow: radial-gradient(circle at 45% 8%, rgba(255, 255, 255, 0.5) 0%, transparent 60%);
      
      --text-main: #1C2724;
      --text-sub: #536963;
      --text-muted: #829892;
      --text-faint: #A6BCB6;

      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(255, 255, 255, 0.65);
      --card-shadow: 0 4px 20px rgba(32, 54, 47, 0.04), 0 1px 3px rgba(32, 54, 47, 0.02);
      --card-hover-bg: rgba(255, 255, 255, 0.9);

      --pill-bg: rgba(62, 98, 88, 0.1);
      --pill-text: #415A53;
      --pill-border: rgba(62, 98, 88, 0.15);

      --accent-green: #10B981;
      --accent-green-light: rgba(16, 185, 129, 0.15);
      --accent-green-border: rgba(16, 185, 129, 0.4);

      --accent-red: #EF4444;
      --accent-red-light: rgba(239, 68, 68, 0.12);
      --accent-red-border: rgba(239, 68, 68, 0.35);

      --nav-icon-color: #4A635C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #CBD6D2;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px 12px;
      color: var(--text-main);
      user-select: none;
    }

    .phone-container {
      width: 393px;
      height: 852px;
      border-radius: 50px;
      background: var(--app-bg-gradient);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 
        0 0 0 11px #161D1A,
        0 0 0 13px rgba(255, 255, 255, 0.12),
        0 24px 60px -10px rgba(0, 0, 0, 0.5);
    }

    .ambient-glow-layer {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 380px;
      background: var(--ambient-glow);
      pointer-events: none;
      z-index: 1;
    }

    .status-bar {
      height: 44px;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      z-index: 20;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    .nav-bar {
      height: 44px;
      padding: 0 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 20;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
    }

    .nav-back-arrow {
      font-size: 20px;
      color: var(--nav-icon-color);
    }

    .nav-counter {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
    }

    .nav-right-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-action-btn {
      background: transparent;
      border: none;
      color: var(--nav-icon-color);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-pill-tag {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      text-decoration: underline;
    }

    .viewport {
      flex: 1;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      padding: 16px 20px 24px;
    }

    .word-hero {
      margin-top: 18px;
      margin-bottom: 24px;
    }

    .word-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .word-text {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-main);
      line-height: 1.15;
    }

    .word-menu-dots {
      color: var(--text-muted);
      font-size: 18px;
      opacity: 0.7;
    }

    .phonetic-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .audio-capsule {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 9999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      font-size: 11px;
      font-weight: 600;
      color: var(--pill-text);
    }

    .phonetic-text {
      font-size: 15px;
      color: var(--text-sub);
      font-family: ui-monospace, "SF Mono", monospace, sans-serif;
    }

    .recall-hint {
      margin-top: 16px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .recall-hint strong {
      color: var(--text-sub);
      font-weight: 600;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 12px;
      margin-bottom: auto;
    }

    .option-card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 18px;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      transition: all 0.22s ease;
    }

    .option-pos {
      font-size: 13px;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 500;
    }

    .option-def {
      font-size: 15.5px;
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.45;
    }

    .stage-bottom-bar {
      margin-top: 24px;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .btn-text-accent {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .accent-bar {
      width: 16px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent-red);
    }

    .home-indicator {
      width: 134px;
      height: 5px;
      background: var(--text-muted);
      opacity: 0.4;
      border-radius: 3px;
      margin: 8px auto 6px;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <div class="ambient-glow-layer"></div>
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <span>􀙇</span>
        <span>􀛨</span>
        <span>100%</span>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-left">
        <span class="nav-back-arrow">‹</span>
        <span class="nav-counter">0/10</span>
      </div>
      <div class="nav-right-actions">
        <button class="nav-action-btn">↩</button>
        <button class="nav-action-btn">☆</button>
        <button class="nav-action-btn"><span class="nav-pill-tag">abc</span></button>
        <button class="nav-action-btn">熟</button>
        <button class="nav-action-btn">···</button>
      </div>
    </div>

    <div class="viewport">
      <div class="word-hero">
        <div class="word-row">
          <h1 class="word-text">range</h1>
          <span class="word-menu-dots">⋮</span>
        </div>
        <div class="phonetic-row">
          <div class="audio-capsule">
            <span>美</span>
            <span>🔊</span>
          </div>
          <span class="phonetic-text">/reɪndʒ/</span>
        </div>
        <p class="recall-hint">先回想词义再选择，想不起来<strong>「看答案」</strong></p>
      </div>

      <div class="options-list">
        <div class="option-card">
          <div class="option-pos">n.</div>
          <div class="option-def">暴怒，狂怒；流行一时的事物</div>
        </div>
        <div class="option-card">
          <div class="option-pos">vt. vi.</div>
          <div class="option-def">安排，筹备</div>
        </div>
        <div class="option-card">
          <div class="option-pos">n.</div>
          <div class="option-def">一系列；范围；射程；山脉</div>
        </div>
        <div class="option-card">
          <div class="option-pos">n.</div>
          <div class="option-def">赛跑，竞速比赛；竞争；种族</div>
        </div>
      </div>

      <div class="stage-bottom-bar">
        <button class="btn-text-accent">
          <span>看答案</span>
          <div class="accent-bar"></div>
        </button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
