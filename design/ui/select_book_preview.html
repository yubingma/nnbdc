<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>选词书 - 原型效果预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 20px;
      background: #0B0E0D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    /* ===== 青碧湖蓝主题（AppThemeStyle.emerald）===== */
    :root {
      --primary: #0B7C9E;
      --text-primary: #17262D;
      --text-secondary: #3E4A52;
      --text-muted: #5A646C;
      --card-bg: rgba(255, 255, 255, 0.5);
      --card-border: rgba(0, 0, 0, 0.15);
      --divider: rgba(0, 0, 0, 0.055);
      --row-tint: rgba(11, 124, 158, 0.07);
      --action-bg: rgba(0, 0, 0, 0.04);
      --circle-border: rgba(62, 74, 82, 0.3);
      --page-bg: linear-gradient(180deg, #F1F7F8 0%, #E4EEEF 45%, #E7F0ED 100%);
      --bar-bg: rgba(255, 255, 255, 0.72);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.03);
      --shadow-bar: 0 -4px 18px rgba(0, 0, 0, 0.06);
      --danger: #EF4444;
    }
    [data-theme="dark"] {
      --primary: #2CD88F;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --card-bg: rgba(24, 32, 47, 0.72);
      --card-border: rgba(255, 255, 255, 0.06);
      --divider: rgba(255, 255, 255, 0.08);
      --row-tint: rgba(44, 216, 143, 0.16);
      --action-bg: rgba(255, 255, 255, 0.05);
      --circle-border: rgba(148, 163, 184, 0.45);
      --page-bg: linear-gradient(180deg, #10201F 0%, #0A1414 60%, #0C1716 100%);
      --bar-bg: rgba(24, 32, 47, 0.9);
      --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.14);
      --shadow-bar: 0 -4px 18px rgba(0, 0, 0, 0.35);
    }

    /* 设计器控制栏（渲染真机图时由统一模具隐藏） */
    .designer-toolbar {
      width: 393px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      color: #334155;
      font-size: 12px;
      font-weight: 600;
    }
    .designer-toolbar button {
      border: 1px solid #E2E8F0;
      background: #F1F5F9;
      color: #334155;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 手机画布（真机外壳由 design/ui/render_mockup_png.js 统一注入） */
    .phone-container {
      width: 393px;
      height: 852px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--page-bg);
      color: var(--text-primary);
    }

    /* ===== 顶部搜索导航（顶部留出真机状态栏安全区） ===== */
    .app-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 50px 16px 10px;
    }
    .btn-back {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
    }
    .search-field {
      flex: 1;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-radius: 19px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-size: 13.5px;
    }

    /* ===== 一级分类 TabBar ===== */
    .primary-tabs {
      display: flex;
      align-items: stretch;
      height: 44px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 0.5px solid var(--divider);
    }
    .primary-tabs::-webkit-scrollbar { display: none; }
    .primary-tab {
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .primary-tab.active {
      color: var(--primary);
      font-weight: 600;
    }
    .primary-tab.active::after {
      content: '';
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      background: var(--primary);
    }

    /* ===== 内容区 ===== */
    .page-body {
      flex: 1;
      padding: 12px 16px 0;
      overflow: hidden;
    }

    /* 新建单词书：轻薄雾行动条 */
    .create-action {
      height: 46px;
      border-radius: 14px;
      background: var(--action-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: var(--text-primary);
    }
    .create-action svg { color: var(--primary); }

    /* 词书列表：直接铺在页面背景上，不套外层卡框 */
    .book-card {
      margin-top: 6px;
    }

    /* 单行词书 */
    .book-row {
      display: flex;
      align-items: center;
      padding: 11px 8px 11px 10px;
      border-radius: 12px;
    }
    .book-row.selected { background: var(--row-tint); }
    .book-icon { flex-shrink: 0; }
    .book-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-left: 12px;
    }
    .book-title {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .book-subtitle {
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: 0.1px;
      color: var(--text-secondary);
    }
    .book-action {
      flex-shrink: 0;
      width: 31px;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .book-action.danger { color: var(--danger); }

    /* 勾选指示圆 */
    .check-circle {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      margin-left: 6px;
      border-radius: 50%;
      border: 1.5px solid var(--circle-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
    }
    .book-row.selected .check-circle {
      background: var(--primary);
      border-color: var(--primary);
    }

    /* 行间发丝分割线（内缩对齐文字左缘） */
    .row-divider {
      height: 1px;
      margin-left: 44px;
      background: var(--divider);
    }

    /* ===== 底部保存栏（平直贴合屏底，不留上方圆角缺口） ===== */
    .save-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 10px 16px 24px 18px;
      background: var(--bar-bg);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-bar);
    }
    .save-summary {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.1px;
      color: var(--text-primary);
    }
    .btn-save {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 42px;
      padding: 0 22px;
      border: none;
      border-radius: 22px;
      background: var(--primary);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11, 124, 158, 0.22);
    }
  </style>
</head>
<body>

  <div class="designer-toolbar">
    <span>🌿 选词书 · 一体化大卡极简原型</span>
    <button onclick="toggleTheme()">
      <span id="theme-icon">🌙</span> <span id="theme-text">暗黑模式</span>
    </button>
  </div>

  <div class="phone-container">
    <!-- 顶部搜索导航 -->
    <div class="app-nav">
      <div class="btn-back">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <div class="search-field">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7.5"></circle>
          <line x1="20.5" y1="20.5" x2="16.2" y2="16.2"></line>
        </svg>
        <span>搜索词库 / 词书名称...</span>
      </div>
    </div>

    <!-- 一级分类 TabBar -->
    <div class="primary-tabs">
      <div class="primary-tab active">自定义</div>
      <div class="primary-tab">四六级</div>
      <div class="primary-tab">英语专业</div>
      <div class="primary-tab">雅思</div>
      <div class="primary-tab">CERF</div>
      <div class="primary-tab">GRE</div>
      <div class="primary-tab">考研</div>
    </div>

    <!-- 内容区 -->
    <div class="page-body">
      <div class="create-action">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>新建单词书</span>
      </div>

      <!-- 一体化聚合大卡：同类词书聚拢，行间发丝分割线 -->
      <div class="book-card">
        <!-- 生词本（暖金书签） -->
        <div class="book-row selected">
          <svg class="book-icon" width="22" height="22" viewBox="0 0 24 24">
            <rect x="4.5" y="3.5" width="15" height="17" rx="3" fill="var(--primary)"></rect>
            <path d="M4.5 6.5 A3 3 0 0 1 7.5 3.5 L7.5 20.5 L4.5 20.5 Z" fill="rgba(0,0,0,0.20)"></path>
            <path d="M13 2 L16.5 2 L16.5 10.5 L14.75 9 L13 10.5 Z" fill="#F59E0B"></path>
            <line x1="10.5" y1="14" x2="14.5" y2="14" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></line>
          </svg>
          <div class="book-info">
            <div class="book-title">生词本</div>
            <div class="book-subtitle">48 词</div>
          </div>
          <div class="book-action">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h9M4 18h9"></path>
              <path d="M16.5 16.5l4-4-2-2-4 4v2h2z"></path>
            </svg>
          </div>
          <div class="book-action danger">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"></path>
            </svg>
          </div>
          <div class="check-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>

        <div class="row-divider"></div>

        <!-- test（自建词书：右下角手写笔） -->
        <div class="book-row selected">
          <svg class="book-icon" width="22" height="22" viewBox="0 0 24 24">
            <rect x="4.5" y="3.5" width="15" height="17" rx="3" fill="var(--primary)"></rect>
            <path d="M4.5 6.5 A3 3 0 0 1 7.5 3.5 L7.5 20.5 L4.5 20.5 Z" fill="rgba(0,0,0,0.20)"></path>
            <line x1="11" y1="8" x2="15" y2="8" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></line>
            <path d="M18.8 14.2 L14.2 18.8 L14.2 20.5 L15.9 20.5 L20.5 15.9 Z" fill="#FFFFFF"></path>
            <path d="M21.2 15.2 L20.5 15.9 L18.8 14.2 L19.5 13.5 A1.2 1.2 0 0 1 21.2 15.2 Z" fill="#38BDF8"></path>
          </svg>
          <div class="book-info">
            <div class="book-title">test</div>
            <div class="book-subtitle">1 词</div>
          </div>
          <div class="book-action">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h9M4 18h9"></path>
              <path d="M16.5 16.5l4-4-2-2-4 4v2h2z"></path>
            </svg>
          </div>
          <div class="book-action danger">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 7h16M9.5 7V5h5v2M6.5 7l1 13h9l1-13"></path>
            </svg>
          </div>
          <div class="check-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部保存栏 -->
    <div class="save-bar">
      <div class="save-summary">已选择 5 本词书</div>
      <button class="btn-save">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>保存</span>
      </button>
    </div>
  </div>

  <script>
    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      if (isDark) {
        root.removeAttribute('data-theme');
        document.getElementById('theme-icon').textContent = '🌙';
        document.getElementById('theme-text').textContent = '暗黑模式';
      } else {
        root.setAttribute('data-theme', 'dark');
        document.getElementById('theme-icon').textContent = '☀️';
        document.getElementById('theme-text').textContent = '明亮模式';
      }
    }
  </script>
</body>
</html>
