<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Excel 导入 · 调整列对应关系</title>
<style>
  :root{
    --bg:#F6F9F8; --card-bg:#FFFFFF; --card-subtle:#F0F6F3; --card-border:#E1EFEA;
    --text-primary:#152724; --text-secondary:#425B57; --text-muted:#789691; --text-faint:#B2CDC8;
    --primary:#18BA7C; --primary-soft:#EDF8F3;
    --amber-text:#D97706; --coral-text:#E54D3B;
    --divider:rgba(21,39,36,0.055);
    --shadow-card:0 4px 16px rgba(24,186,124,0.05),0 1px 3px rgba(0,0,0,0.02);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:#DFE7E4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .device-mockup{
    width:393px;height:852px;background:var(--bg);border-radius:54px;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }

  /* 状态栏 */
  .status-bar{
    height:44px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;font-weight:700;color:var(--text-primary);flex-shrink:0;
  }
  .status-right{display:flex;gap:6px;align-items:center;}

  /* 导航栏 */
  .nav-bar{
    height:52px;padding:0 12px;display:grid;grid-template-columns:44px 1fr 44px;
    align-items:center;flex-shrink:0;
  }
  .nav-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text-primary);}
  .nav-title{text-align:center;font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px;}
  .nav-action{text-align:right;font-size:13.5px;font-weight:500;color:var(--primary);}

  /* 内容区（背景页） */
  .content{flex:1;overflow:hidden;padding:2px 16px 0;}
  .card{background:var(--card-bg);border-radius:16px;box-shadow:var(--shadow-card);}
  .divider{height:1px;background:var(--divider);margin-left:46px;}
  .text-action{display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:500;color:var(--primary);flex-shrink:0;}

  .file-card{display:flex;align-items:center;gap:12px;padding:13px 14px;margin-bottom:10px;}
  .file-icon{
    width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .file-main{flex:1;min-width:0;}
  .file-name{font-size:13.5px;font-weight:600;color:var(--text-primary);letter-spacing:-0.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-meta{font-size:11px;color:var(--text-muted);margin-top:3px;}

  .recognize-bar{display:flex;align-items:center;gap:5px;padding:0 4px 10px;font-size:11px;color:var(--text-muted);}
  .recognize-bar svg{flex-shrink:0;color:var(--primary);}
  .recognize-bar .text-action{margin-left:auto;font-size:11.5px;}

  .stats{display:flex;align-items:baseline;gap:16px;padding:2px 4px 12px;}
  .stat{display:flex;align-items:baseline;gap:3px;}
  .stat-num{font-size:14px;font-weight:700;font-family:'Roboto',-apple-system,sans-serif;letter-spacing:-0.3px;}
  .stat-label{font-size:11.5px;color:var(--text-muted);}

  .word-row{display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--card-border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .cb.on{background:var(--primary);border-color:var(--primary);}
  .cb.on::after{content:'';width:9px;height:5px;border-left:2px solid #FFFFFF;border-bottom:2px solid #FFFFFF;transform:rotate(-45deg) translateY(-1px);}
  .word-main{flex:1;min-width:0;}
  .word-spell{font-size:14.5px;font-weight:600;color:var(--text-primary);letter-spacing:-0.1px;}
  .word-meaning{font-size:11.5px;color:var(--text-secondary);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 底部操作栏（背景） */
  .bottom-bar{padding:12px 16px 24px;flex-shrink:0;display:flex;align-items:center;gap:14px;}
  .selected-count{font-size:12.5px;color:var(--text-secondary);flex-shrink:0;}
  .selected-count b{font-size:15px;font-weight:700;color:var(--text-primary);font-family:'Roboto',-apple-system,sans-serif;letter-spacing:-0.3px;}
  .btn-primary{
    flex:1;height:48px;border-radius:14px;background:var(--primary);color:#FFFFFF;
    font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:-0.1px;
  }

  /* 遮罩 + 底部面板 */
  .sheet-overlay{position:absolute;inset:0;background:rgba(9,26,22,0.34);z-index:20;}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
    border-radius:24px 24px 0 0;padding:10px 16px 26px;
    box-shadow:0 -10px 36px rgba(0,0,0,0.16);
  }
  .sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(21,39,36,0.14);margin:0 auto 16px;}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;}
  .sheet-title{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px;}
  .sheet-desc{font-size:11.5px;color:var(--text-muted);margin-top:5px;line-height:1.6;}
  .sheet-close{
    width:28px;height:28px;border-radius:50%;background:var(--card-subtle);color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  .map-list{margin-top:12px;}
  .map-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;}
  .map-label{font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.1px;}
  .map-label .req{color:var(--coral-text);font-size:12.5px;margin-left:1px;}
  .map-value{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--text-primary);}
  .map-value .col{font-weight:600;font-family:'Roboto',-apple-system,sans-serif;}
  .map-value .hint{color:var(--text-muted);font-weight:400;}
  .map-value.unset{color:var(--text-muted);}
  .map-value svg{color:var(--text-muted);}

  .sheet-actions{display:flex;gap:12px;padding-top:16px;}
  .btn-ghost{
    flex:0 0 96px;height:48px;border-radius:14px;background:var(--card-subtle);color:var(--text-secondary);
    font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;
  }
</style>
</head>
<body>
<div class="device-mockup">

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>09:41</span>
    <div class="status-right"><span>5G</span><span>100%</span></div>
  </div>

  <!-- 导航栏 -->
  <div class="nav-bar">
    <div class="nav-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </div>
    <div class="nav-title">从 Excel 导入</div>
    <div class="nav-action">重选</div>
  </div>

  <!-- 背景内容 -->
  <div class="content">

    <div class="card file-card">
      <div class="file-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="8" y1="13" x2="16" y2="13"></line>
          <line x1="8" y1="17" x2="16" y2="17"></line>
        </svg>
      </div>
      <div class="file-main">
        <div class="file-name">考研核心词 Unit1-3.xlsx</div>
        <div class="file-meta">导入到「考研核心词」· 128 行</div>
      </div>
    </div>

    <div class="recognize-bar">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>已识别：单词列 B · 释义列 C · 词性列 D</span>
      <div class="text-action">调整</div>
    </div>

    <div class="stats">
      <div class="stat"><span class="stat-num" style="color:var(--primary)">96</span><span class="stat-label">可导入</span></div>
      <div class="stat"><span class="stat-num" style="color:var(--text-muted)">12</span><span class="stat-label">已存在</span></div>
      <div class="stat"><span class="stat-num" style="color:var(--amber-text)">8</span><span class="stat-label">未收录</span></div>
      <div class="stat"><span class="stat-num" style="color:var(--coral-text)">4</span><span class="stat-label">格式错误</span></div>
    </div>

    <div class="card" style="overflow:hidden">
      <div class="word-row">
        <div class="cb on"></div>
        <div class="word-main">
          <div class="word-spell">ability</div>
          <div class="word-meaning">n. 能力；才能</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="word-row">
        <div class="cb on"></div>
        <div class="word-main">
          <div class="word-spell">abstract</div>
          <div class="word-meaning">adj. 抽象的；摘要</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="word-row">
        <div class="cb on"></div>
        <div class="word-main">
          <div class="word-spell">academic</div>
          <div class="word-meaning">adj. 学术的；学院的</div>
        </div>
      </div>
    </div>

  </div>

  <!-- 底部操作栏 -->
  <div class="bottom-bar">
    <div class="selected-count">已选 <b>96</b> 个</div>
    <div class="btn-primary">导入 96 个单词</div>
  </div>

  <!-- 遮罩 -->
  <div class="sheet-overlay"></div>

  <!-- 调整列对应关系面板 -->
  <div class="sheet">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <div>
        <div class="sheet-title">调整列对应关系</div>
        <div class="sheet-desc">选择每一列代表的内容，预览会立即更新</div>
      </div>
      <div class="sheet-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>

    <div class="map-list">

      <div class="map-row">
        <div class="map-label">单词<span class="req">*</span></div>
        <div class="map-value">
          <span class="col">B 列</span>
          <span class="hint">word</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="divider" style="margin-left:0"></div>

      <div class="map-row">
        <div class="map-label">释义</div>
        <div class="map-value">
          <span class="col">C 列</span>
          <span class="hint">中文释义</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="divider" style="margin-left:0"></div>

      <div class="map-row">
        <div class="map-label">词性</div>
        <div class="map-value">
          <span class="col">D 列</span>
          <span class="hint">词性</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="divider" style="margin-left:0"></div>

      <div class="map-row">
        <div class="map-label">单元</div>
        <div class="map-value unset">
          <span>未指定</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>

    </div>

    <div class="sheet-actions">
      <div class="btn-ghost">取消</div>
      <div class="btn-primary">应用</div>
    </div>
  </div>

</div>
</body>
</html>
