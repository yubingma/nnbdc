<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>打卡完成 - 原型效果预览</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #0B0E0D;
    }

    :root {
      /* 经典翡翠青绿主题 */
      --primary: #18BA7C;
      --primary-dark: #0F8558;
      --bg: #F4F8F6;
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-border: rgba(255, 255, 255, 0.9);
      --text-primary: #152724;
      --text-secondary: #57706B;
      --text-muted: #8CA49F;
      --divider: rgba(87, 112, 107, 0.12);
      --warm-accent: #FA6E59;
      --shadow-card: 0 10px 30px -4px rgba(24, 186, 124, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
    }

    .phone-container {
      width: 393px;
      height: 852px;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 顶部庆祝 Hero */
    .finish-hero {
      position: relative;
      height: 258px;
      width: 100%;
      background: linear-gradient(145deg, var(--primary) 0%, var(--primary-dark) 100%);
      border-radius: 0 0 32px 32px;
      box-shadow: 0 18px 36px -8px rgba(24, 186, 124, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 26px;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 顶部居中柔光晕 */
    .hero-glow {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 45%, transparent 70%);
      pointer-events: none;
    }

    /* 完成印章 */
    .hero-stamp {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.5);
    }
    .hero-stamp svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: #FFFFFF;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero-title {
      color: #FFFFFF;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.12);
    }
    .hero-subtitle {
      color: rgba(255, 255, 255, 0.92);
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* 内容滚动区域 */
    .finish-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* 指标成果卡片 */
    .metrics-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
      padding: 20px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }
    .card-head svg {
      width: 18px;
      height: 18px;
      fill: var(--primary);
      opacity: 0.55;
    }

    /* 成果指标三列 */
    .metrics-row {
      display: flex;
      align-items: center;
    }
    .metric-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .metric-value-box {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }
    .metric-value {
      font-family: Roboto, -apple-system, sans-serif;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      line-height: 1.0;
    }
    .metric-unit {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
    }
    .metric-col-divider {
      width: 0.5px;
      height: 44px;
      background: var(--divider);
      margin: 0 12px;
    }

    /* 操作入口分组内聚卡片 (Grouped Inset Card) */
    .action-group-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .action-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .action-item:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    .action-icon {
      width: 24px;
      height: 24px;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .action-icon.primary svg {
      stroke: var(--primary);
    }
    .action-icon.accent svg {
      stroke: var(--warm-accent);
    }
    .action-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .action-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.1px;
    }
    .action-subtitle {
      font-size: 12px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.1px;
    }
    .action-arrow {
      width: 14px;
      height: 14px;
      stroke: var(--text-secondary);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0.35;
      flex-shrink: 0;
    }
    .action-divider {
      height: 0.5px;
      background: var(--divider);
      margin: 0 20px;
    }

    /* 底部温润微提示 */
    .finish-footer {
      text-align: center;
      padding: 8px 0 4px;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <div class="phone-container">
    <!-- 顶部庆祝 Hero -->
    <div class="finish-hero">
      <div class="hero-glow"></div>
      <div class="hero-stamp">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1 class="hero-title">打卡成功</h1>
      <p class="hero-subtitle">今日学习完成 · 继续坚持每天进步一点点</p>
    </div>

    <!-- 主体区域 -->
    <div class="finish-body">
      <!-- 打卡成果指标卡 -->
      <div class="metrics-card">
        <div class="card-head">
          <span class="card-title">打卡成果</span>
          <svg viewBox="0 0 24 24">
            <path d="M12 2l2.4 7.2h7.6l-6.2 4.5 2.4 7.3-6.2-4.5-6.2 4.5 2.4-7.3-6.2-4.5h7.6z"/>
          </svg>
        </div>
        <div class="metrics-row">
          <div class="metric-col">
            <span class="metric-label">魔法泡泡</span>
            <div class="metric-value-box">
              <span class="metric-value">4</span>
            </div>
          </div>
          <div class="metric-col-divider"></div>
          <div class="metric-col">
            <span class="metric-label">今日积分</span>
            <div class="metric-value-box">
              <span class="metric-value">+10</span>
            </div>
          </div>
          <div class="metric-col-divider"></div>
          <div class="metric-col">
            <span class="metric-label">连续打卡</span>
            <div class="metric-value-box">
              <span class="metric-value">12</span>
              <span class="metric-unit">天</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 操作入口分组内聚卡片 -->
      <div class="action-group-card">
        <!-- 前往词表 -->
        <div class="action-item">
          <div class="action-icon primary">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="4" width="18" height="16" rx="3"/>
              <line x1="7" y1="8" x2="17" y2="8"/>
              <line x1="7" y1="12" x2="14" y2="12"/>
            </svg>
          </div>
          <div class="action-info">
            <span class="action-title">前往词表</span>
            <span class="action-subtitle">复习今日学习的单词</span>
          </div>
          <svg class="action-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="action-divider"></div>

        <!-- 生成打卡海报 -->
        <div class="action-item">
          <div class="action-icon primary">
            <svg viewBox="0 0 24 24">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
            </svg>
          </div>
          <div class="action-info">
            <span class="action-title">生成打卡海报</span>
            <span class="action-subtitle">坚持开口，值得记录</span>
          </div>
          <svg class="action-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="action-divider"></div>

        <!-- 给个好评 -->
        <div class="action-item">
          <div class="action-icon accent">
            <svg viewBox="0 0 24 24">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </div>
          <div class="action-info">
            <span class="action-title">给个好评</span>
            <span class="action-subtitle">喜欢，就支持一下</span>
          </div>
          <svg class="action-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>

      <div class="finish-footer">
        今日单词已全部存入长期记忆池 · FSRS 算法持续追踪
      </div>
    </div>
  </div>
</body>
</html>
