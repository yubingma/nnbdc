<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>词表页 · 更多菜单入口</title>
<style>
  :root{
    --bg:#F6F9F8; --card-bg:#FFFFFF; --card-subtle:#F0F6F3; --card-border:#E1EFEA;
    --text-primary:#152724; --text-secondary:#425B57; --text-muted:#789691; --text-faint:#B2CDC8;
    --primary:#18BA7C; --primary-soft:#EDF8F3;
    --divider:rgba(21,39,36,0.055);
    --shadow-card:0 4px 16px rgba(24,186,124,0.05),0 1px 3px rgba(0,0,0,0.02);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    background:#DFE7E4;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;
  }
  .device-mockup{
    width:393px;height:852px;background:var(--bg);border-radius:54px;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }

  /* 状态栏 */
  .status-bar{
    height:44px;padding:0 24px;display:flex;justify-content:space-between;align-items:center;
    font-size:13.5px;font-weight:700;color:var(--text-primary);flex-shrink:0;
  }
  .status-right{display:flex;gap:6px;align-items:center;}

  /* 顶部导航栏 */
  .app-top-nav{
    padding:4px 14px 10px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--divider);background:var(--card-bg);flex-shrink:0;
  }
  .nav-left{display:flex;align-items:center;gap:10px;}
  .nav-back{display:flex;align-items:center;color:var(--text-primary);}
  .nav-title-text{font-size:16px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px;}
  .nav-actions{display:flex;align-items:center;gap:6px;}
  .nav-icon-btn{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    color:var(--text-primary);border-radius:9px;
  }
  .nav-icon-btn.active{background:var(--card-subtle);}

  /* 单词列表 */
  .word-scroll{flex:1;overflow:hidden;padding:12px 14px 0;display:flex;flex-direction:column;gap:8px;}
  .w-row{background:var(--card-bg);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-card);}
  .w-spell{font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.1px;}
  .w-desc{font-size:11.5px;color:var(--text-secondary);margin-top:4px;}

  /* 更多菜单（毛玻璃） */
  .menu-card{
    position:absolute;top:102px;right:12px;width:172px;z-index:50;
    background:rgba(255,255,255,0.80);
    -webkit-backdrop-filter:blur(18px);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.55);
    border-radius:16px;
    padding:6px 4px;
    box-shadow:0 12px 34px -8px rgba(9,30,24,0.22),0 2px 6px rgba(0,0,0,0.04);
  }
  .menu-item{
    display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;
    font-size:13px;font-weight:500;color:var(--text-primary);
  }
  .menu-item svg{color:var(--text-secondary);flex-shrink:0;}
  .menu-item.is-new{color:var(--primary);font-weight:600;}
  .menu-item.is-new svg{color:var(--primary);}
</style>
</head>
<body>
<div class="device-mockup">

  <!-- 状态栏 -->
  <div class="status-bar">
    <span>09:41</span>
    <div class="status-right"><span>5G</span><span>100%</span></div>
  </div>

  <!-- 顶部导航栏 -->
  <div class="app-top-nav">
    <div class="nav-left">
      <div class="nav-back">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </div>
      <div class="nav-title-text">考研核心词</div>
    </div>
    <div class="nav-actions">
      <div class="nav-icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </div>
      <div class="nav-icon-btn active">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="5" r="1.9"></circle>
          <circle cx="12" cy="12" r="1.9"></circle>
          <circle cx="12" cy="19" r="1.9"></circle>
        </svg>
      </div>
    </div>
  </div>

  <!-- 单词列表（背景） -->
  <div class="word-scroll">
    <div class="w-row">
      <div class="w-spell">ability</div>
      <div class="w-desc">n. 能力；才能</div>
    </div>
    <div class="w-row">
      <div class="w-spell">abstract</div>
      <div class="w-desc">adj. 抽象的；摘要</div>
    </div>
    <div class="w-row">
      <div class="w-spell">academic</div>
      <div class="w-desc">adj. 学术的；学院的</div>
    </div>
    <div class="w-row">
      <div class="w-spell">accomplish</div>
      <div class="w-desc">v. 完成；实现</div>
    </div>
    <div class="w-row">
      <div class="w-spell">accumulate</div>
      <div class="w-desc">v. 积累；积聚</div>
    </div>
    <div class="w-row">
      <div class="w-spell">accurate</div>
      <div class="w-desc">adj. 准确的；精确的</div>
    </div>
    <div class="w-row">
      <div class="w-spell">acknowledge</div>
      <div class="w-desc">v. 承认；致谢</div>
    </div>
    <div class="w-row">
      <div class="w-spell">acquire</div>
      <div class="w-desc">v. 获得；学到</div>
    </div>
  </div>

  <!-- 更多菜单 -->
  <div class="menu-card">

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="6" x2="20" y2="6"></line>
        <line x1="4" y1="12" x2="14" y2="12"></line>
        <line x1="4" y1="18" x2="9" y2="18"></line>
      </svg>
      <span>排序: 默认</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
      </svg>
      <span>浏览模式</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
      <span>从词书导入</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span>扫描导入</span>
    </div>

    <!-- 新增入口 -->
    <div class="menu-item is-new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="3" y1="15" x2="21" y2="15"></line>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      <span>从 Excel 导入</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <span>说中文</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
      </svg>
      <span>说英语</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 8 6 6"></path>
        <path d="m4 14 6-6 2-3"></path>
        <path d="M2 5h12"></path>
        <path d="M7 2h1"></path>
        <path d="m22 22-5-10-5 10"></path>
        <path d="M14 18h6"></path>
      </svg>
      <span>翻译句子</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="2"></rect>
        <line x1="6" y1="10" x2="6.01" y2="10"></line>
        <line x1="10" y1="10" x2="10.01" y2="10"></line>
        <line x1="14" y1="10" x2="14.01" y2="10"></line>
        <line x1="18" y1="10" x2="18.01" y2="10"></line>
        <line x1="8" y1="14" x2="16" y2="14"></line>
      </svg>
      <span>拼写(打字)</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19 7-7 3 3-7 7-3-3z"></path>
        <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
        <path d="m2 2 7.586 7.586"></path>
        <circle cx="11" cy="11" r="2"></circle>
      </svg>
      <span>拼写(手写)</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
      <span>遮挡中文</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
        <line x1="2" y1="2" x2="22" y2="22"></line>
      </svg>
      <span>遮挡英文</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
      <span>随身听</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="13.5" cy="6.5" r=".5"></circle>
        <circle cx="17.5" cy="10.5" r=".5"></circle>
        <circle cx="8.5" cy="7.5" r=".5"></circle>
        <circle cx="6.5" cy="12.5" r=".5"></circle>
        <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path>
      </svg>
      <span>外观主题</span>
    </div>

    <div class="menu-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <span>导出为 PDF</span>
    </div>

  </div>

</div>
</body>
</html>
