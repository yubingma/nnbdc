<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日学习计划 · 方案 B（极简杂志风与双段能量胶囊）</title>
  <style>
    :root {
      /* 清新晨光双光源氛围背景 */
      --bg-ambient: 
        radial-gradient(circle at 86% 6%, rgba(16, 185, 129, 0.22) 0%, transparent 42%),
        radial-gradient(circle at 6% 36%, rgba(255, 255, 255, 0.95) 0%, transparent 48%),
        radial-gradient(circle at 60% 102%, rgba(14, 165, 233, 0.16) 0%, transparent 50%),
        #E4EDE8;

      /* 一级毛玻璃卡片规格 */
      --card-bg: rgba(255, 255, 255, 0.68);
      --card-edge: rgba(255, 255, 255, 0.28);
      --card-shadow: 0 16px 40px -12px rgba(18, 52, 38, 0.14), 0 4px 14px -3px rgba(18, 52, 38, 0.04);

      /* 文本与分割层级 */
      --text-primary: #12211C;
      --text-secondary: #475E57;
      --text-muted: #789088;
      --text-faint: #A6BDB6;
      --divider: rgba(18, 52, 38, 0.07);
      --hairline: rgba(18, 52, 38, 0.05);

      /* 品牌强调色与微色谱 */
      --accent: #10B981;
      --accent-glow: rgba(16, 185, 129, 0.42);
      --new-word: #0EA5E9;
      --new-word-soft: rgba(14, 165, 233, 0.09);
      --old-word: #10B981;
      --old-word-soft: rgba(16, 185, 129, 0.09);
      --wrong: #EF4444;
      --wrong-soft: rgba(239, 68, 68, 0.08);

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="dark"] {
      --bg-ambient: 
        radial-gradient(circle at 86% 6%, rgba(16, 185, 129, 0.16) 0%, transparent 40%),
        radial-gradient(circle at 8% 34%, rgba(255, 255, 255, 0.05) 0%, transparent 45%),
        radial-gradient(circle at 50% 105%, rgba(14, 165, 233, 0.10) 0%, transparent 50%),
        #0E1513;

      --card-bg: rgba(24, 34, 30, 0.72);
      --card-edge: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.55);

      --text-primary: #F2F7F4;
      --text-secondary: #A0B5AE;
      --text-muted: #6A827B;
      --text-faint: #3F524C;
      --divider: rgba(255, 255, 255, 0.08);
      --hairline: rgba(255, 255, 255, 0.06);

      --accent: #34D399;
      --accent-glow: rgba(52, 211, 153, 0.32);
      --new-word-soft: rgba(14, 165, 233, 0.14);
      --old-word-soft: rgba(16, 185, 129, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: transparent;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .device-mockup {
      width: 100%;
      max-width: 393px;
      height: 852px;
      max-height: 852px;
      background: var(--bg-ambient);
      border-radius: 54px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 48px;
      flex-shrink: 0;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      z-index: 10;
    }

    .app-body {
      flex: 1;
      padding: 6px 20px 16px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* 顶栏 */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
      margin-bottom: 6px;
    }
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .header-badge-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-caption {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .streak-chip {
      font-size: 10.5px;
      font-weight: 700;
      color: #D97706;
      background: rgba(245, 158, 11, 0.12);
      padding: 2px 7px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .header-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }
    .header-info-icon {
      color: var(--text-muted);
      opacity: 0.6;
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .header-tool-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--card-edge);
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-tool-btn:active {
      transform: scale(0.92);
    }

    /* ===== 核心大卡：极简杂志风 ===== */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 26px;
      padding: 22px 22px 20px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      gap: 16px;
    }

    /* 今日目标超大数字 */
    .goal-hero-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 2px 0;
    }
    .goal-hero-tag {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .goal-hero-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .goal-hero-num {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .goal-hero-unit {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    /* 核心视觉亮点：双段能量比例槽 (Dual Segment Ratio Bar) */
    .ratio-bar-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .ratio-bar-capsule {
      width: 100%;
      height: 12px;
      border-radius: 100px;
      background: var(--hairline);
      display: flex;
      overflow: hidden;
      padding: 1.5px;
      gap: 2px;
    }
    .ratio-segment-new {
      width: 26%;
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #0284C7, #38BDF8);
      box-shadow: 0 0 8px rgba(14, 165, 233, 0.4);
    }
    .ratio-segment-old {
      width: 74%;
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, #059669, #34D399);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }
    .ratio-bar-legend {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* 双浮动微卡：新词 / 旧词（轻量微背景、大点击域） */
    .data-cards-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .sub-data-card {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid var(--card-edge);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    [data-theme="dark"] .sub-data-card {
      background: rgba(255, 255, 255, 0.04);
    }
    .sub-data-card:active {
      transform: scale(0.97);
    }
    .sub-data-card.new {
      border-left: 3px solid var(--new-word);
    }
    .sub-data-card.old {
      border-left: 3px solid var(--old-word);
    }
    .card-top-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .card-big-num {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      margin-top: 2px;
    }
    .sub-data-card.new .card-big-num { color: var(--new-word); }
    .sub-data-card.old .card-big-num { color: var(--old-word); }

    /* 今日总步数微进度 */
    .total-step-info {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0 4px;
    }

    /* 旗舰主按钮 */
    .hero-btn {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      border: none;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 24px -4px var(--accent-glow), 0 3px 8px -2px rgba(16, 185, 129, 0.3);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hero-btn:active {
      transform: scale(0.975);
      box-shadow: 0 4px 14px -2px var(--accent-glow);
    }
    .hero-btn:hover svg {
      transform: translateX(3px);
    }
    .hero-btn svg {
      transition: transform 0.2s ease;
    }

    /* ===== 学习轨道 ===== */
    .track-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .track-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }
    .track-action {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      background: none;
      border: none;
    }

    .track-card {
      background: var(--card-bg);
      border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 22px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .track-item + .track-item {
      border-top: 1px solid var(--divider);
    }

    .track-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .track-badge-title {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }
    .track-step-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .track-flow {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .flow-branch {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .branch-status {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .branch-status.correct {
      color: var(--accent);
      background: var(--old-word-soft);
    }
    .branch-status.wrong {
      color: var(--wrong);
      background: var(--wrong-soft);
    }
    .flow-arrow {
      color: var(--text-faint);
      font-size: 10px;
    }
    .flow-target-chip {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      background: rgba(0, 0, 0, 0.03);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--hairline);
    }
    [data-theme="dark"] .flow-target-chip {
      background: rgba(255, 255, 255, 0.05);
    }

    /* 底部导航栏 */
    .nav-bar {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      border-top: 1px solid var(--hairline);
      margin-top: 6px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
    }
    .nav-item.active {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="device-mockup">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span>09:41</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <svg width="15" height="11" viewBox="0 0 17 12" fill="currentColor">
          <rect x="0" y="8" width="2.5" height="4" rx="0.8"/>
          <rect x="4.5" y="5.5" width="2.5" height="6.5" rx="0.8"/>
          <rect x="9" y="3" width="2.5" height="9" rx="0.8"/>
          <rect x="13.5" y="0" width="2.5" height="12" rx="0.8"/>
        </svg>
        <svg width="22" height="11" viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="0.9" y="0.9" width="19.2" height="10.2" rx="3.5"/>
          <rect x="2.5" y="2.5" width="13" height="7" rx="1.8" fill="currentColor"/>
          <path d="M22 4.5v3" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- 主体区域 -->
    <div class="app-body">
      
      <!-- 极简顶栏 -->
      <div class="app-header">
        <div class="header-left">
          <div class="header-badge-row">
            <span class="header-caption">TODAY'S PLAN</span>
            <span class="streak-chip">🔥 12天连胜</span>
          </div>
          <div class="header-title-wrap">
            <span class="header-title">今日学习计划</span>
            <span class="header-info-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M12 16v-4M12 8h.01"></path>
              </svg>
            </span>
          </div>
        </div>
        <div class="header-tool-btn" title="轨道与参数调整">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </div>
      </div>

      <!-- 核心大卡：现代杂志大字与双段能量胶囊 -->
      <div class="hero-card">
        
        <!-- 今日目标超大数字 -->
        <div class="goal-hero-box">
          <span class="goal-hero-tag">TARGET PER DAY</span>
          <div class="goal-hero-row">
            <span class="goal-hero-num">500</span>
            <span class="goal-hero-unit">
              词
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </span>
          </div>
        </div>

        <!-- 视觉创新点：双段能量比例胶囊槽 -->
        <div class="ratio-bar-section">
          <div class="ratio-bar-capsule">
            <div class="ratio-segment-new" title="新词 26%"></div>
            <div class="ratio-segment-old" title="旧词 74%"></div>
          </div>
          <div class="ratio-bar-legend">
            <span style="color: var(--new-word);">● 新学 26% (130词)</span>
            <span style="color: var(--old-word);">● 温故 74% (370词)</span>
          </div>
        </div>

        <!-- 双浮动触控微卡 -->
        <div class="data-cards-grid">
          <div class="sub-data-card new">
            <div class="card-top-row">
              <span>今日新词</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="card-big-num">130</div>
          </div>

          <div class="sub-data-card old">
            <div class="card-top-row">
              <span>今日复习</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="card-big-num">370</div>
          </div>
        </div>

        <!-- 总步数极细进度 -->
        <div class="total-step-info">
          <span>今日进度 0 / 1000 步</span>
          <span style="font-weight: 700; color: var(--text-primary);">0%</span>
        </div>

        <!-- 旗舰主行动按钮 -->
        <button class="hero-btn">
          <span>开始学习</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

      </div>

      <!-- 学习轨道（自适应流程卡） -->
      <div class="track-section">
        <div class="track-header">
          <span class="track-title">学习轨道</span>
          <button class="track-action">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line>
            </svg>
            <span>调整轨道</span>
          </button>
        </div>

        <div class="track-card">
          <!-- 新词轨道 -->
          <div class="track-item">
            <div class="track-meta">
              <span class="track-badge-title" style="color: var(--new-word);">新词测评</span>
              <span class="track-step-name">英译汉</span>
            </div>
            <div class="track-flow">
              <div class="flow-branch">
                <span class="branch-status correct">✓ 答对</span>
                <span class="flow-arrow">➔</span>
                <span class="flow-target-chip">汉译英</span>
              </div>
              <div class="flow-branch">
                <span class="branch-status wrong">✕ 答错</span>
                <span class="flow-arrow">➔</span>
                <span class="flow-target-chip">汉译英</span>
              </div>
            </div>
          </div>

          <!-- 旧词轨道 -->
          <div class="track-item">
            <div class="track-meta">
              <span class="track-badge-title" style="color: var(--old-word);">旧词测评</span>
              <span class="track-step-name">英译汉</span>
            </div>
            <div class="track-flow">
              <div class="flow-branch">
                <span class="branch-status correct">✓ 答对</span>
                <span class="flow-arrow">➔</span>
                <span class="flow-target-chip" style="color: var(--accent); font-weight: 700;">直接结束</span>
              </div>
              <div class="flow-branch">
                <span class="branch-status wrong">✕ 答错</span>
                <span class="flow-arrow">➔</span>
                <span class="flow-target-chip">汉译英</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部极简导航栏 -->
      <div class="nav-bar">
