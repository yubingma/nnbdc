<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>词表 · 手写拼写模式演示</title>
<style>
  :root {
    --bg: #F5F9F7;
    --card-bg: #FFFFFF;
    --card-subtle: #EDF5F2;
    --divider: rgba(24, 186, 124, 0.08);
    --text-primary: #152724;
    --text-secondary: #425B57;
    --text-muted: #789691;
    --primary: #18BA7C;
    --primary-hover: #15A56E;
    --primary-soft: #E8F8F1;
    --green-text: #18BA7C;
    --active-card-bg: #EDF8F3;
    --active-card-border: #18BA7C;
    --shadow-card: 0 3px 12px rgba(24, 186, 124, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    --shadow-active: 0 6px 18px rgba(24, 186, 124, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background-color: #DFE7E4;
    color: var(--text-primary);
  }

  .device-mockup {
    width: 100%;
    max-width: 412px;
    height: 844px;
    background: var(--bg);
    border-radius: 42px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: background-color 0.3s ease;
  }

  .status-bar {
    height: 38px;
    padding: 0 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary);
    z-index: 10;
  }

  .app-top-nav {
    padding: 6px 16px 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--divider);
    background: var(--card-bg);
  }
  .nav-title-group { display: flex; align-items: center; gap: 12px; }
  .btn-nav-back { font-size: 18px; color: var(--text-primary); display: flex; align-items: center; }
  .nav-title-text { font-size: 17px; font-weight: 800; color: var(--text-primary); }
  .nav-bookmarks-group { display: flex; align-items: center; gap: 8px; }
  .bookmark-tag {
    padding: 3px 8px; background: var(--card-subtle); border: 1px solid var(--divider);
    border-radius: 6px; font-size: 11px; font-weight: 800; color: var(--text-secondary);
  }
  .bookmark-tag.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-more-menu { font-size: 16px; color: var(--text-secondary); padding: 2px 4px; }

  .word-cards-scroll-view {
    flex: 1; padding: 12px 14px 30px 14px; overflow: hidden;
    display: flex; flex-direction: column; gap: 10px;
  }

  .word-row-card {
    background: var(--card-bg); border-radius: 18px;
    border: 1.5px solid var(--divider); box-shadow: var(--shadow-card);
    display: flex; align-items: stretch; overflow: hidden;
  }
  .word-row-card.active-item { background: var(--active-card-bg); border-color: var(--active-card-border); border-width: 2px; box-shadow: var(--shadow-active); }
  .row-left-sidebar { width: 52px; background: var(--card-subtle); border-right: 1px solid var(--divider); display: flex; align-items: center; justify-content: center; padding: 10px 0; flex-shrink: 0; }
  .active-item .row-left-sidebar { background: rgba(24, 186, 124, 0.08); }
  .ring-progress-badge { width: 32px; height: 32px; position: relative; display: flex; align-items: center; justify-content: center; }
  .ring-svg { transform: rotate(-90deg); width: 32px; height: 32px; }
  .ring-bg-circle { stroke: var(--divider); stroke-width: 2.5; fill: none; }
  .ring-val-circle { stroke: var(--primary); stroke-width: 2.5; stroke-linecap: round; fill: none; }
  .ring-index-num { position: absolute; font-size: 12px; font-weight: 800; color: var(--text-primary); }
  .active-item .ring-index-num { color: var(--primary); }

  .row-main { flex: 1; padding: 12px 4px 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-width: 0; }
  .readonly-spell {
    font-size: 16px; font-weight: 700; color: var(--text-muted);
    border: none; border-bottom: 1.5px solid rgba(0,0,0,0.12); background: transparent; padding-bottom: 3px;
    min-height: 21px; letter-spacing: 0.2px;
  }
  .readonly-spell.filled { color: var(--primary); border-bottom-color: rgba(24,186,124,0.3); font-weight: 800; }
  .hint-letters { font-size: 12px; color: #B3BDB9; min-height: 14px; }

  .row-right-action { padding: 10px 8px 10px 4px; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .row-meaning { font-size: 12px; font-weight: 700; color: var(--text-secondary); max-width: 108px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pencil-btn { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; color: #789691; }
  .pencil-btn svg { width: 20px; height: 20px; }
  .active-item .pencil-btn { color: var(--primary); }

  /* 手写板 overlay */
  .handwriting-overlay {
    position: absolute; inset: 0; z-index: 50; background: #FFFFFF;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    box-shadow: 0 -12px 30px rgba(0,0,0,0.10);
  }
  .hw-header {
    padding: 14px 16px 8px 16px; display: flex; align-items: center; gap: 8px;
  }
  .hw-header .hw-title { font-size: 15px; font-weight: 800; color: rgba(0,0,0,0.85); flex: 1; }
  .hw-spinner { width: 16px; height: 16px; border: 2px solid rgba(24,186,124,0.25); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; opacity: 0; }
  .hw-spinner.on { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hw-close { color: #9aa5a1; font-size: 20px; }
  .hw-canvas-wrap { flex: 1; position: relative; }
  #board { width: 100%; height: 100%; display: block; }
  .hw-footer {
    padding: 0 16px 26px 16px; display: flex; justify-content: center; gap: 22px;
  }
  .hw-btn {
    width: 92px; height: 52px; border-radius: 14px; background: rgba(120,150,145,0.08);
    border: 1px solid rgba(120,150,145,0.18); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px; color: #6f7d78; font-size: 11px;
  }
  .hw-btn svg { width: 20px; height: 20px; }

  /* 标注胶囊 */
  .caption-pill {
    position: absolute; left: 50%; top: 75%; transform: translateX(-50%); z-index: 70;
    background: rgba(11, 26, 22, 0.82); color: #EAF7F4; font-size: 15px; font-weight: 700;
    padding: 10px 20px; border-radius: 999px; letter-spacing: 0.3px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.22), 0 0 0 1px rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 9px; opacity: 0; white-space: nowrap;
  }
  .caption-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #2CD88F; }
</style>
</head>
<body>
  <div class="device-mockup">
    <div class="status-bar"><span>9:41</span><span>5G&nbsp;&nbsp;100%</span></div>

    <div class="app-top-nav">
      <div class="nav-title-group">
        <div class="btn-nav-back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        </div>
        <div class="nav-title-text">今日旧词 (63)</div>
      </div>
      <div class="nav-bookmarks-group">
        <div class="bookmark-tag">S</div>
        <div class="bookmark-tag active">1</div>
        <div class="bookmark-tag">E</div>
        <div class="btn-more-menu">···</div>
      </div>
    </div>

    <div class="word-cards-scroll-view" id="list">
      <!-- silence(active) -->
      <div class="word-row-card active-item">
        <div class="row-left-sidebar">
          <div class="ring-progress-badge">
            <svg class="ring-svg" viewBox="0 0 32 32"><circle class="ring-bg-circle" cx="16" cy="16" r="13"></circle><circle class="ring-val-circle" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="20.42"></circle></svg>
            <span class="ring-index-num">1</span>
          </div>
        </div>
        <div class="row-main">
          <div class="readonly-spell" id="spell-silence">请在屏幕手写拼写</div>
          <div class="hint-letters" id="hint-silence">sil</div>
        </div>
        <div class="row-right-action">
          <span class="row-meaning">n. 沉默；寂静</span>
          <div class="pencil-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
          </div>
        </div>
      </div>
      <!-- prestige -->
      <div class="word-row-card">
        <div class="row-left-sidebar">
          <div class="ring-progress-badge"><svg class="ring-svg" viewBox="0 0 32 32"><circle class="ring-bg-circle" cx="16" cy="16" r="13"></circle><circle class="ring-val-circle" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="40.84"></circle></svg><span class="ring-index-num">2</span></div>
        </div>
        <div class="row-main">
          <div class="readonly-spell filled">prestige</div>
          <div class="hint-letters"></div>
        </div>
        <div class="row-right-action"><span class="row-meaning">n. 威望；声誉</span>
          <div class="pencil-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></div>
        </div>
      </div>
      <!-- stiffen -->
      <div class="word-row-card">
        <div class="row-left-sidebar">
          <div class="ring-progress-badge"><svg class="ring-svg" viewBox="0 0 32 32"><circle class="ring-bg-circle" cx="16" cy="16" r="13"></circle><circle class="ring-val-circle" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="61.26"></circle></svg><span class="ring-index-num">3</span></div>
        </div>
        <div class="row-main">
          <div class="readonly-spell filled">stiffen</div>
          <div class="hint-letters"></div>
        </div>
        <div class="row-right-action"><span class="row-meaning">v. 变硬；变僵</span>
          <div class="pencil-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></div>
        </div>
      </div>
      <!-- meanwhile -->
      <div class="word-row-card">
        <div class="row-left-sidebar">
          <div class="ring-progress-badge"><svg class="ring-svg" viewBox="0 0 32 32"><circle class="ring-bg-circle" cx="16" cy="16" r="13"></circle><circle class="ring-val-circle completed" cx="16" cy="16" r="13" stroke-dasharray="81.68" stroke-dashoffset="0"></circle></svg><span class="ring-index-num">4</span></div>
        </div>
        <div class="row-main">
          <div class="readonly-spell filled">meanwhile</div>
          <div class="hint-letters"></div>
        </div>
        <div class="row-right-action"><span class="row-meaning">adv. 同时；在此期间</span>
          <div class="pencil-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></div>
        </div>
      </div>
    </div>

    <!-- 手写板 overlay -->
    <div class="handwriting-overlay" id="hw">
      <div class="hw-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18BA7C" stroke-width="2"><path d="M9 11.3V4a1 1 0 0 1 1-1h0a1 1 0 0 1 1 1"/><path d="M14 4a1 1 0 0 1 1-1h0a1 1 0 0 1 1 1v5"/><path d="M5 13h14v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/></svg>
        <div class="hw-title">手写板</div>
        <div class="hw-spinner" id="hwSpinner"></div>
        <div class="hw-close">✕</div>
      </div>
      <div class="hw-canvas-wrap"><canvas id="board"></canvas></div>
      <div class="hw-footer">
        <div class="hw-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>重写</div>
        <div class="hw-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.6 1 1.3 1 2.5h6c0-1.2.3-1.9 1-2.5A6 6 0 0 0 12 3z"/></svg>提示</div>
        <div class="hw-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>回退</div>
      </div>
    </div>

    <div class="caption-pill" id="caption"></div>
  </div>

<script>
(function () {
  var cap = document.getElementById('caption');
  var hw = document.getElementById('hw');
  var spinner = document.getElementById('hwSpinner');
  var spellSilence = document.getElementById('spell-silence');
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  // ---- 手写 strokes：lowercase 字母集（局部坐标 0..1, y 向下） ----
  var LETTERS = {
    s: [[[0.82,0.60],[0.58,0.52],[0.34,0.50],[0.18,0.55],[0.16,0.62],[0.30,0.68],[0.56,0.72],[0.78,0.76],[0.88,0.84],[0.86,0.95],[0.70,1.0],[0.44,1.0],[0.24,0.95],[0.16,0.87]]],
    i: [[[0.40,0.06],[0.40,0.11]], [[0.40,0.50],[0.40,1.0]]],
    l: [[[0.45,0.03],[0.45,1.0]]],
    e: [[[0.90,0.75],[0.10,0.75],[0.10,0.86],[0.28,0.97],[0.55,1.0],[0.75,0.96],[0.87,0.86],[0.90,0.75]]],
    n: [[[0.12,0.50],[0.12,1.0]], [[0.12,0.50],[0.32,0.50],[0.58,0.50],[0.78,0.56],[0.86,0.68],[0.86,1.0]]],
    c: [[[0.84,0.56],[0.56,0.50],[0.30,0.54],[0.16,0.66],[0.15,0.82],[0.28,0.94],[0.54,1.0],[0.80,0.97],[0.86,0.88]]]
  };

  // ---- 布局："silence" 每个字母一个槽位 ----
  var WORD = 'silence';
  var slots = [];  // {x0, w}
  function layoutSlots(margin, totalW, gap) {
    var n = WORD.length;
    var w = (totalW - gap * (n - 1)) / n;
    var arr = [];
    for (var i = 0; i < n; i++) arr.push({ x0: margin + i * (w + gap), w: w });
    return arr;
  }
  // stroke 长度
  function strokeLen(pts) {
    var L = 0;
    for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    return L;
  }
  function drawStroke(pts) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length - 1; i++) {
      var mx = (pts[i][0] + pts[i+1][0]) / 2, my = (pts[i][1] + pts[i+1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    var last = pts[pts.length-1];
    ctx.lineTo(last[0], last[1]);
    ctx.stroke();
  }

  // 画板属性和变换
  var dpr = (window.devicePixelRatio || 2);
  var ctxScale = 1;
  var inkColor = '#17A876';
  var pen = null; // {x,y}

  function sizeCanvas() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    return { w: w, h: h };
  }

  // 将 word 字母画到 canvas，progress 0..1 揭示
  function computeStrokes(geo) {
    var gap = 6, margin = 22, totalW = geo.w - margin * 2;
    slots = layoutSlots(margin, totalW, gap);
    var strokeH = Math.min(112, geo.h * 0.30);
    var topY = (geo.h - strokeH) / 2;
    var base = topY + strokeH;
    var all = [];
    for (var i = 0; i < WORD.length; i++) {
      var ch = WORD[i];
      if (!LETTERS[ch]) continue;
      var slot = slots[i];
      var letterStrokes = LETTERS[ch];
      for (var sIdx = 0; sIdx < letterStrokes.length; sIdx++) {
        var pts = [];
        var src = letterStrokes[sIdx];
        for (var k = 0; k < src.length; k++) {
          var px = slot.x0 + src[k][0] * slot.w;
          var py = base - src[k][1] * strokeH;
          pts.push([px, py]);
        }
        all.push(pts);
      }
    }
    return all;
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 揭示 drawing，progress 0..1
  function renderStrokes(strokes, progress) {
    clearCanvas();
    if (strokes == null || strokes.length === 0) { pen = null; return; }
    var lens = strokes.map(strokeLen);
    var total = lens.reduce(function (a, b) { return a + b; }, 0);
    if (total <= 0) return;
    var target = progress * total;
    ctx.strokeStyle = inkColor;
    ctx.lineWidth = 4.2;
    var acc = 0;
    pen = null;
    for (var s = 0; s < strokes.length; s++) {
      if (target >= acc + lens[s]) {
        drawStroke(strokes[s]);
        acc += lens[s];
      } else {
        // 部分绘制当前 stroke
        var frac = (target - acc) / lens[s];
        if (frac > 0) {
          var subPts = partialPoints(strokes[s], frac);
          drawStroke(subPts);
          pen = subPts[subPts.length - 1];
        }
        break;
      }
    }
  }
  function partialPoints(pts, frac) {
    var L = strokeLen(pts) * frac;
    if (L <= 0) return [pts[0]];
    var out = [pts[0]];
    var acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
      if (acc + seg >= L) {
        var t = (L - acc) / seg;
        out.push([pts[i-1][0] + (pts[i][0]-pts[i-1][0])*t, pts[i-1][1] + (pts[i][1]-pts[i-1][1])*t]);
        break;
      }
      acc += seg;
      out.push(pts[i]);
    }
    return out;
  }
  function drawPen() {
    if (!pen) return;
    ctx.beginPath(); ctx.fillStyle = inkColor;
    ctx.arc(pen[0], pen[1], 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.arc(pen[0]-1.5, pen[1]-1.5, 2, 0, Math.PI*2); ctx.fill();
  }

  // ---- 时间轴 ----
  var PHASES = [
    [0.00, 0.16, 'list', '词表 · 手写模式'],
    [0.16, 0.26, 'open',  '点击单词右侧铅笔'],
    [0.26, 0.36, 'board', '手写板 · 在手写区拼写'],
    [0.36, 0.72, 'write', '正在手写 silence'],
    [0.72, 0.80, 'recognize', '识别中…'],
    [0.80, 0.88, 'fill',  '识别成功 · 回填词表'],
    [0.88, 1.00, 'done',  '泡泡单词 · Progress over Perfection']
  ];
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function easeOutCubic(x) { x = clamp(x,0,1); return 1 - Math.pow(1-x, 3); }
  function easeInCubic(x) { x = clamp(x,0,1); return x*x*x; }
  function easeInOutCubic(x) { x = clamp(x,0,1); return x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

  var strokesCache = null;
  var geoCache = null;

  // 暴露给外部逐帧调用
  window.__setTime = function (t) {
    t = clamp(t, 0, 1);
    var phase = 'list', pstart = 0, pend = 1;
    for (var i = 0; i < PHASES.length; i++) {
      if (t >= PHASES[i][0] && t < PHASES[i][1]) { phase = PHASES[i][2]; pstart = PHASES[i][0]; pend = PHASES[i][1]; break; }
      if (i === PHASES.length - 1 && t >= PHASES[i][1]) { phase = PHASES[i][2]; pstart = PHASES[i][0]; pend = PHASES[i][1]; }
    }
    var capText = '';
    for (var j = 0; j < PHASES.length; j++) if (PHASES[j][2] === phase) capText = PHASES[j][3];

    // 手写板位移
    var hwY = 1.0;
    if (phase === 'open') hwY = 1 - easeOutCubic((t - 0.16) / 0.10);
    else if (phase === 'board' || phase === 'write' || phase === 'recognize') hwY = 0;
    else if (phase === 'fill') hwY = easeInCubic((t - 0.80) / 0.08);
    else hwY = 1;
    hw.style.transform = 'translateY(' + (hwY * 100).toFixed(3) + '%)';

    // 书写进度
    var wp = 0;
    if (phase === 'write') wp = easeInOutCubic((t - 0.36) / 0.36);
    else if (phase === 'recognize' || phase === 'fill') wp = 1;

    // 画布
    var geo = { w: canvas.clientWidth, h: canvas.clientHeight };
    if (canvas.clientWidth === 0) { canvas.clientWidth; }
    if (hwY === 1) { // 完全收起
      clearCanvas();
    } else {
      if (geo.w > 0 && geo.h > 0 && (geo.w !== (geoCache && geoCache.w) || geo.h !== (geoCache && geoCache.h))) {
        geoCache = { w: geo.w, h: geo.h };
        sizeCanvas();
        strokesCache = computeStrokes(geo);
      }
      if (wp <= 0) clearCanvas();
      else renderStrokes(strokesCache, wp);
      drawPen();
    }

    // 识别 spinner
    spinner.className = 'hw-spinner' + (phase === 'recognize' ? ' on' : '');

    // 回填
    if (phase === 'fill' || phase === 'done') {
      spellSilence.textContent = 'silence';
      spellSilence.className = 'readonly-spell filled';
      var hintEl = document.getElementById('hint-silence');
      hintEl.textContent = '';
    }

    // 标注
    cap.textContent = capText;
    var fade = clamp(Math.min((t - pstart) / 0.02, (pend - t) / 0.02, 1), 0, 1);
    cap.style.opacity = fade.toFixed(3);
    cap.style.transform = 'translateX(-50%) translateY(' + ((1 - fade) * 6) + 'px)';
  };

  // 初始化画布尺寸
  window.addEventListener('load', function () {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    geoCache = { w: w, h: h };
    strokesCache = computeStrokes(geoCache);
    window.__setTime(0);
  });
})();
</script>
</body>
