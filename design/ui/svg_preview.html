<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DeepSeek 生成的 spring 核心意象 SVG 矢量预览</title>
  <style>
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .preview-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 24px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .svg-hub {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(30, 36, 48, 0.95), rgba(16, 20, 26, 0.98));
      border: 2px solid #00e6b8;
      box-shadow: 0 0 24px rgba(0, 230, 184, 0.25), inset 0 0 16px rgba(0, 230, 184, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #f0f6fc;
    }
    .badge {
      font-size: 11px;
      background: rgba(0, 230, 184, 0.15);
      color: #00e6b8;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(0, 230, 184, 0.3);
    }
    .desc {
      font-size: 13px;
      color: #8b949e;
      text-align: center;
      max-width: 320px;
      line-height: 1.6;
    }
    .metrics {
      margin-top: 16px;
      font-size: 12px;
      color: #58a6ff;
      background: rgba(88, 166, 255, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
    }
  </style>
</head>
<body>

  <div class="preview-card">
    <div class="badge">DeepSeek 原生代码生成 · 纯 SVG 矢量</div>
    <div class="svg-hub">
      <img src="assets/spring_core.svg" width="110" height="110" alt="Spring Core SVG">
    </div>
    <div class="title">spring · 核心动态意象</div>
    <div class="desc">
      底部压缩盘旋的机械弹簧（蓄力） ➔ 中部喷薄而出的晶莹泉水（涌现） ➔ 顶部破土绽放的初春嫩芽（生机）。
    </div>
    <div class="metrics">
      ⚡️ 体积仅 3.8 KB · 0 位图失真 · 成本仅约 0.002 元
    </div>
  </div>

</body>
</html>
