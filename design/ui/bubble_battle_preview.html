<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>泡泡升空对战 · 实验抢先体验</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #010c1c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 手机视口容器 */
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 860px;
      background: radial-gradient(circle at 50% 20%, #053b75 0%, #021a38 55%, #010a18 100%);
      overflow: hidden;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 480px) {
      #gameContainer {
        border-radius: 36px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        height: 92vh;
      }
    }

    /* 主画布 */
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: pointer;
    }

    /* 顶部 HUD 状态栏 */
    .hud-layer {
      position: absolute;
      top: 16px;
      left: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
    }

    .vs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 6px 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .player-chip {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .avatar-op {
      background: linear-gradient(135deg, #fb923c, #ea580c);
    }

    .avatar-me {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
    }

    .info-col {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .score-num {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
      font-family: ui-monospace, monospace;
    }

    .score-op {
      color: #fb923c;
    }

    .score-me {
      color: #38bdf8;
    }

    .vs-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border: 2.5px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      font-style: italic;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 目标词卡片 */
    .target-badge {
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 22px;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .target-label {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
    }

    .target-meaning-highlight {
      color: #fbbf24;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4);
    }

    /* 水位下沉警示栏 */
    .water-warning {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.85);
      backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 10px;
      z-index: 9;
      pointer-events: none;
      white-space: nowrap;
      transition: top 0.15s ease-out;
      display: none;
    }

    /* 结算弹窗 */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-card {
      background: #0d1e33;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 24px;
      padding: 26px 20px;
      width: 82%;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 20px;
    }

    .btn-restart {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }

    /* 底部道具控制栏 */
    .props-layer {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 14px;
      pointer-events: auto;
    }

    .prop-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(10, 25, 45, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.15s ease-out;
      position: relative;
    }

    .prop-btn:active {
      transform: scale(0.95);
    }

    .prop-btn-attack {
      border-color: rgba(239, 68, 68, 0.5);
    }
    .prop-btn-attack:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .prop-btn-purge {
      border-color: rgba(56, 189, 248, 0.5);
    }
    .prop-btn-purge:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    .prop-icon {
      font-size: 16px;
    }

    .prop-badge {
      background: #fbbf24;
      color: #000;
      border-radius: 10px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 900;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <!-- 顶部状态栏 -->
    <div class="hud-layer">
      <div class="vs-bar">
        <div class="player-chip">
          <div class="avatar avatar-op">🌊</div>
          <div class="info-col">
            <span class="player-name">完美的溪流</span>
            <span id="scoreOp" class="score-num score-op">20</span>
          </div>
        </div>

        <div class="vs-badge">VS</div>

        <div class="player-chip" style="flex-direction: row-reverse;">
          <div class="avatar avatar-me">✏️</div>
          <div class="info-col" style="align-items: flex-end;">
            <span class="player-name">淡然的铅笔(我)</span>
            <span id="scoreMe" class="score-num score-me">0</span>
          </div>
        </div>
      </div>

      <div class="target-badge">
        <span class="target-label">请戳破对应英文：</span>
        <span id="targetMeaning" class="target-meaning-highlight">夏天</span>
      </div>
    </div>

    <!-- 水位下降警报 -->
    <div id="waterWarning" class="water-warning">⚠️ 水位压顶！游戏区压缩</div>

    <!-- 游戏画布 -->
    <canvas id="canvas"></canvas>

    <!-- 底部道具操作栏 -->
    <div class="props-layer">
      <button id="btnAttack" class="prop-btn prop-btn-attack" title="向对手空气区砸入重力死泡，压低对手水面40px">
        <span class="prop-icon">🚀</span>
        <span class="prop-title">砸水雷(攻击)</span>
        <span id="attackCount" class="prop-badge">1</span>
      </button>
      <button id="btnPurge" class="prop-btn prop-btn-purge" title="射出金针戳破空气区1颗死泡，水面抬升一格">
        <span class="prop-icon">🎯</span>
        <span class="prop-title">戳死泡(抬升)</span>
        <span id="purgeCount" class="prop-badge">1</span>
      </button>
    </div>

    <!-- 结算模态框 -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal-card">
        <div style="font-size: 42px; margin-bottom: 8px;" id="resultEmoji">🏆</div>
        <div id="modalTitle" class="modal-title">对局胜利！</div>
        <div id="modalDesc" class="modal-desc">我方得分: 80 | 对手得分: 40</div>
        <button id="btnRestart" class="btn-restart">再来一局体验</button>
      </div>
    </div>
  </div>

  <script>
    // 词库与高频配置
    const VOCAB = [
      { word: 'summer', meaning: '夏天' },
      { word: 'happy', meaning: '快乐' },
      { word: 'father', meaning: '父亲' },
      { word: 'good', meaning: '优秀的' },
      { word: 'ocean', meaning: '海洋' },
      { word: 'sunshine', meaning: '阳光' },
      { word: 'dream', meaning: '梦想' },
      { word: 'breeze', meaning: '微风' },
      { word: 'courage', meaning: '勇气' },
      { word: 'wonder', meaning: '奇迹' },
      { word: 'treasure', meaning: '宝藏' },
      { word: 'crystal', meaning: '水晶' }
    ];

    const BUBBLE_COLORS = [
      { r: 96, g: 165, b: 250 },  // 蓝
      { r: 167, g: 139, b: 250 }, // 紫
      { r: 52, g: 211, b: 153 },  // 绿
      { r: 244, g: 114, b: 182 }, // 粉
      { r: 251, g: 191, b: 36 },  // 金
      { r: 56, g: 189, b: 248 }   // 青
    ];

    // 道具与对战高级状态
    let attackProps = 1;
    let purgeProps = 1;
    let deadBubbles = [];
    let projectiles = [];
    let opponentShake = 0;

    function updatePropsUI() {
      document.getElementById('attackCount').textContent = attackProps;
      document.getElementById('purgeCount').textContent = purgeProps;
    }

    // Web Audio 合成音效（纯原生无外链）
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      pop() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      },
      wrong() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.setValueAtTime(110, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      },
      needle() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      },
      deadPop() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      },
      mine() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    };

    // 游戏状态管理
    const container = document.getElementById('gameContainer');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resize);
    resize();

    let scoreMe = 0;
    let scoreOp = 20;
    let combo = 0;
    let opponentPressure = 0; // 对手被水雷轰击压沉深度 (120px 溃败)
    let targetWord = VOCAB[0];
    let isGameOver = false;

    // 水面惩罚线 (基准 135px, 随死泡泡数量下沉)
    const BASE_WATER_Y = 135;
    let waterSurfaceY = BASE_WATER_Y;
    let targetWaterY = BASE_WATER_Y;
    let wavePhase = 0;

    let bubbles = [];
    let particles = [];
    let floatTexts = [];
    let nextId = 0;
    let opponentTimer = 0;

    // 重新计算水面压迫位置
    function updateWaterPressure() {
      targetWaterY = BASE_WATER_Y + deadBubbles.length * 30;
    }

    // 将错词/漏词转化为死泡泡堆在空气区
    function addDeadBubble(wordText) {
      deadBubbles.push({
        id: nextId++,
        word: wordText,
        x: width * 0.5,
        y: waterSurfaceY - 30,
        radius: 26,
        isPopping: false,
        popProgress: 0
      });
      updateWaterPressure();
      AudioEngine.wrong();
    }

    // 触发金针戳破空气区死泡泡
    function firePurgeNeedle() {
      if (deadBubbles.length === 0) {
        floatTexts.push({
          x: width * 0.5,
          y: waterSurfaceY - 20,
          text: '水面已无死泡负担!',
          color: '#38bdf8',
          life: 0.8
        });
        return false;
      }
      AudioEngine.needle();
      const target = deadBubbles[0];
      projectiles.push({
        type: 'needle',
        x: target.x || (width * 0.5),
        y: height - 80,
        targetX: target.x || (width * 0.5),
        targetY: target.y || (waterSurfaceY - 30),
        targetBubble: target
      });
      return true;
    }

    // 触发重力水雷攻击对手
    function fireAttackMine() {
      AudioEngine.mine();
      projectiles.push({
        type: 'mine',
        startX: width * 0.5,
        startY: height - 80,
        targetX: 50,
        targetY: 45,
        progress: 0
      });
      floatTexts.push({
        x: width * 0.5,
        y: height - 120,
        text: '🚀 水雷出膛 轰击对手!',
        color: '#f87171',
        life: 1.0
      });
    }

    // 按钮事件绑定
    document.getElementById('btnAttack').onclick = (e) => {
      e.stopPropagation();
      AudioEngine.init();
      if (isGameOver || attackProps <= 0) return;
      attackProps--;
      updatePropsUI();
      fireAttackMine();
    };

    document.getElementById('btnPurge').onclick = (e) => {
      e.stopPropagation();
      AudioEngine.init();
      if (isGameOver || purgeProps <= 0) return;
      if (firePurgeNeedle()) {
        purgeProps--;
        updatePropsUI();
      }
    };

    function startNewRound() {
      if (isGameOver) return;
      bubbles = [];

      // 1. 选取目标词
      targetWord = VOCAB[Math.floor(Math.random() * VOCAB.length)];
      document.getElementById('targetMeaning').textContent = targetWord.meaning;

      // 2. 选取 3 个不重复干扰词
      const remainingVocab = VOCAB.filter(v => v.word !== targetWord.word);
      const shuffledRemaining = remainingVocab.sort(() => 0.5 - Math.random());
      const distractors = shuffledRemaining.slice(0, 3);

      // 3. 组成 4 个选项并打乱
      const roundWords = [targetWord, ...distractors].sort(() => 0.5 - Math.random());

      // 4. 4 个独立泳道分布
      const lanes = [0, 1, 2, 3].sort(() => 0.5 - Math.random());
      const margin = 50;
      const usableWidth = width - margin * 2;
      const laneWidth = usableWidth / 4;

      for (let i = 0; i < 4; i++) {
        const lane = lanes[i];
        const baseX = margin + lane * laneWidth + laneWidth / 2 + (Math.random() - 0.5) * 8;
        const radius = 38.0;
        const color = BUBBLE_COLORS[Math.floor(Math.random() * BUBBLE_COLORS.length)];
        const startY = height + radius + 15 + i * 50;

        bubbles.push({
          id: nextId++,
          word: roundWords[i],
          x: baseX,
          y: startY,
          baseX: baseX,
          radius: radius,
          speed: 55 + Math.random() * 20,
          swingAmp: 3.5 + Math.random() * 1.5,
          swingFreq: 1.0 + Math.random() * 0.5,
          phase: Math.random() * Math.PI * 2,
          color: color,
          isPopping: false,
          popProgress: 0,
          isWrong: false,
          wrongProgress: 0
        });
      }
    }

    function createParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 120;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: 2 + Math.random() * 2.5,
          color: color,
          life: 0.4 + Math.random() * 0.2,
          maxLife: 0.5
        });
      }
    }

    // 交互点击
    container.addEventListener('pointerdown', (e) => {
      AudioEngine.init();
      if (isGameOver) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        if (b.isPopping) continue;

        const dist = Math.hypot(b.x - clickX, b.y - clickY);
        if (dist <= b.radius + 8) {
          if (b.word.word === targetWord.word) {
            // 戳中目标！
            AudioEngine.pop();
            b.isPopping = true;
            scoreMe += 10;
            combo++;
            document.getElementById('scoreMe').textContent = scoreMe;

            createParticles(b.x, b.y, b.color, 16);

            // 连击奖励：Combo ≥ 2 自动射出金针戳死泡，并加道具
            if (combo >= 2) {
              if (deadBubbles.length > 0) {
                firePurgeNeedle();
              }
              if (combo % 2 === 0) {
                attackProps++;
                purgeProps++;
                updatePropsUI();
              }
            }

            const comboStr = combo > 1 ? ` Combo x${combo}!` : '';
            floatTexts.push({
              x: b.x,
              y: b.y - 10,
              text: `+10${comboStr}`,
              color: '#38bdf8',
              life: 1.0
            });

            // 戳对后，其余干扰泡泡破裂并进入下一题
            setTimeout(() => {
              for (const other of bubbles) {
                if (other !== b && !other.isPopping) {
                  createParticles(other.x, other.y, other.color, 6);
                }
              }
              startNewRound();
            }, 300);
          } else {
            // 戳错！变成死泡泡堆到空气区，水面下沉！
            b.isWrong = true;
            b.wrongProgress = 0;
            scoreMe = Math.max(0, scoreMe - 5);
            combo = 0;
            document.getElementById('scoreMe').textContent = scoreMe;

            // 加入空气区死泡泡！
            addDeadBubble(b.word.word);

            floatTexts.push({
              x: b.x,
              y: b.y - 10,
              text: `-5 变成死泡压顶!`,
              color: '#ef4444',
              life: 1.0
            });
          }
          break;
        }
      }
    });

    function endGame(isWin, reason) {
      if (isGameOver) return;
      isGameOver = true;
      document.getElementById('modalOverlay').style.display = 'flex';
      document.getElementById('resultEmoji').textContent = isWin ? '🏆' : '🌊';
      document.getElementById('modalTitle').textContent = isWin ? '挑战胜利！' : '本局惜败';
      document.getElementById('modalDesc').textContent = reason || (isWin ? '对手海面崩溃，成功击溃对手！' : '我方海面被死泡压沉淘汰');
    }

    document.getElementById('btnRestart').onclick = () => {
      scoreMe = 0;
      scoreOp = 20;
      combo = 0;
      opponentPressure = 0;
      attackProps = 1;
      purgeProps = 1;
      updatePropsUI();
      isGameOver = false;
      deadBubbles = [];
      projectiles = [];
      targetWaterY = BASE_WATER_Y;
      waterSurfaceY = BASE_WATER_Y;
      bubbles = [];
      particles = [];
      floatTexts = [];
      document.getElementById('scoreMe').textContent = scoreMe;
      document.getElementById('scoreOp').textContent = scoreOp;
      document.getElementById('modalOverlay').style.display = 'none';
      startNewRound();
    };

    // 启动首轮
    updatePropsUI();
    startNewRound();

    // 渲染主循环
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      // 1. 逻辑推进
      if (!isGameOver) {
        wavePhase += dt * 3.5;
        waterSurfaceY += (targetWaterY - waterSurfaceY) * Math.min(1.0, dt * 6.0);

        // 警示条显隐
        const warning = document.getElementById('waterWarning');
        if (deadBubbles.length > 0) {
          warning.style.display = 'block';
          warning.style.top = `${waterSurfaceY - 26}px`;
          warning.textContent = `⚠️ 空气区压积 ${deadBubbles.length} 颗死泡！海面下沉 ${Math.round(waterSurfaceY - BASE_WATER_Y)}px`;
        } else {
          warning.style.display = 'none';
        }

        if (waterSurfaceY >= height * 0.74) {
          endGame(false, '⚠️ 我方海面被死泡严重压沉，不幸淹没淘汰！');
        }

        // 虚拟对手得分 & 偶尔也投掷重力死泡反击
        opponentTimer += dt;
        if (opponentTimer > 4.5) {
          opponentTimer = 0;
          scoreOp += 10;
          document.getElementById('scoreOp').textContent = scoreOp;
          floatTexts.push({
            x: 70,
            y: 90,
            text: '+10',
            color: '#fb923c',
            life: 1.0
          });
        }

        // 泡泡防重叠物理软排斥
        for (let i = 0; i < bubbles.length; i++) {
          for (let j = i + 1; j < bubbles.length; j++) {
            const b1 = bubbles[i];
            const b2 = bubbles[j];
            if (b1.isPopping || b2.isPopping) continue;

            const dx = b2.x - b1.x;
            const dy = b2.y - b1.y;
            const dist = Math.hypot(dx, dy);
            const minDist = b1.radius + b2.radius + 16;
            if (dist < minDist && dist > 0.001) {
              const overlap = (minDist - dist) * 0.5;
              const nx = dx / dist;
              const ny = dy / dist;
              b1.x -= nx * overlap;
              b1.y -= ny * overlap;
              b2.x += nx * overlap;
              b2.y += ny * overlap;
            }
          }
        }

        // 泡泡运动与漏过判定
        let hasTargetExpired = false;
        for (let i = bubbles.length - 1; i >= 0; i--) {
          const b = bubbles[i];
          if (b.isPopping) {
            b.popProgress += dt * 5.0;
            if (b.popProgress >= 1.0) bubbles.splice(i, 1);
            continue;
          }
          if (b.isWrong) {
            b.wrongProgress += dt * 8.0;
            if (b.wrongProgress >= 1.0) b.isWrong = false;
          }

          b.y -= b.speed * dt;
          b.x += Math.sin(now / 1000 * b.swingFreq + b.phase) * (b.swingAmp * 0.04);

          // 浮出海面：如果是目标词漏过，变成死泡泡堆到空气区！
          if (b.y - b.radius <= waterSurfaceY) {
            if (b.word.word === targetWord.word) {
              hasTargetExpired = true;
              addDeadBubble(b.word.word);
              floatTexts.push({
                x: b.x,
                y: waterSurfaceY + 20,
                text: '漏词！死泡堆积压顶',
                color: '#ef4444',
                life: 1.0
              });
            }
            createParticles(b.x, waterSurfaceY, b.color, 6);
            bubbles.splice(i, 1);
          }
        }

        if (hasTargetExpired) {
          setTimeout(() => {
            startNewRound();
          }, 300);
        }

        // 排布空气区死泡泡位置（吸附在海浪正上方）
        const deadCount = deadBubbles.length;
        for (let i = 0; i < deadCount; i++) {
          const db = deadBubbles[i];
          const cols = Math.min(5, deadCount);
          const colIndex = i % 5;
          const rowIndex = Math.floor(i / 5);
          const colWidth = (width - 60) / cols;
          db.x = 30 + colIndex * colWidth + colWidth / 2;
          db.y = waterSurfaceY - 26 - rowIndex * 40;

          if (db.isPopping) {
            db.popProgress += dt * 6.0;
            if (db.popProgress >= 1.0) {
              deadBubbles.splice(i, 1);
              updateWaterPressure();
              break;
            }
          }
        }

        // 弹道逻辑更新（金针 & 水雷）
        for (let i = projectiles.length - 1; i >= 0; i--) {
          const p = projectiles[i];
          if (p.type === 'needle') {
            // 金针高速向上穿透
            p.y -= 750 * dt;
            if (p.y <= p.targetY) {
              // 击中死泡！
              AudioEngine.deadPop();
              p.targetBubble.isPopping = true;
              createParticles(p.targetX, p.targetY, { r: 148, g: 163, b: 184 }, 14);
              floatTexts.push({
                x: p.targetX,
                y: p.targetY - 15,
                text: '💥 死泡破裂！海面抬升',
                color: '#38bdf8',
                life: 1.0
              });
              projectiles.splice(i, 1);
            }
          } else if (p.type === 'mine') {
            // 水雷飞向对手头像
            p.progress += dt * 1.8;
            p.x = p.startX + (p.targetX - p.startX) * p.progress;
            p.y = p.startY + (p.targetY - p.startY) * p.progress - Math.sin(p.progress * Math.PI) * 120;
            if (p.progress >= 1.0) {
              // 砸中对手！
              AudioEngine.mine();
              createParticles(p.targetX, p.targetY, { r: 239, g: 68, b: 68 }, 18);
              opponentShake = 0.4;
              opponentPressure += 40;
              floatTexts.push({
                x: 100,
                y: 50,
                text: '💥 对手水面被砸低 40px！',
                color: '#f87171',
                life: 1.2
              });
              if (opponentPressure >= 120) {
                setTimeout(() => {
                  endGame(true, '🚀 重力水雷彻底击沉对手海面，获得全胜！');
                }, 500);
              }
              projectiles.splice(i, 1);
            }
          }
        }

        // 对手受击晃动恢复
        if (opponentShake > 0) {
          opponentShake -= dt;
        }

        // 粒子更新
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) particles.splice(i, 1);
        }

        // 浮字更新
        for (let i = floatTexts.length - 1; i >= 0; i--) {
          const ft = floatTexts[i];
          ft.y -= 30 * dt;
          ft.life -= dt * 1.2;
          if (ft.life <= 0) floatTexts.splice(i, 1);
        }
      }

      // 2. 绘制场景
      ctx.clearRect(0, 0, width, height);

      // 海底光斑与光柱
      ctx.fillStyle = 'rgba(56, 189, 248, 0.04)';
      ctx.beginPath();
      ctx.moveTo(width * 0.1, 0);
      ctx.lineTo(width * 0.45, 0);
      ctx.lineTo(width * 0.7, height);
      ctx.lineTo(width * 0.25, height);
      ctx.fill();

      // 绘制底部海床
      ctx.fillStyle = '#010915';
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height - 40);
      ctx.quadraticCurveTo(width * 0.25, height - 65, width * 0.5, height - 45);
      ctx.quadraticCurveTo(width * 0.75, height - 25, width, height - 50);
      ctx.lineTo(width, height);
      ctx.fill();

      // 绘制上升泡泡
      for (const b of bubbles) {
        ctx.save();
        ctx.translate(b.x, b.y);

        if (b.isPopping) {
          const scale = 1.0 + b.popProgress * 0.4;
          const alpha = Math.max(0, 1.0 - b.popProgress);
          ctx.strokeStyle = `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, ${alpha})`;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, b.radius * scale, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
          continue;
        }

        if (b.isWrong) {
          const delta = Math.sin(b.wrongProgress * Math.PI * 4) * 0.2 * (1 - b.wrongProgress);
          ctx.scale(1 + delta, 1 - delta);
        }

        const grad = ctx.createRadialGradient(
          -b.radius * 0.35, -b.radius * 0.35, 2,
          0, 0, b.radius
        );
        grad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
        grad.addColorStop(0.35, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, 0.2)`);
        grad.addColorStop(0.8, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, 0.38)`);
        grad.addColorStop(1, `rgba(${b.color.r}, ${b.color.g}, ${b.color.b}, 0.65)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.6;
        ctx.stroke();

        ctx.save();
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.ellipse(-b.radius * 0.3, -b.radius * 0.3, b.radius * 0.25, b.radius * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold 13px -apple-system, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 1;
        ctx.fillText(b.word.word, 0, 0);

        ctx.restore();
      }

      // 绘制水面波浪遮罩（空气区暗调）
      ctx.fillStyle = 'rgba(1, 10, 24, 0.9)';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, waterSurfaceY);
      const steps = 24;
      for (let i = 0; i <= steps; i++) {
        const x = width * (i / steps);
        const yOffset = Math.sin(wavePhase + (i / steps) * 4 * Math.PI) * 5;
        ctx.lineTo(x, waterSurfaceY + yOffset);
      }
      ctx.lineTo(width, 0);
      ctx.closePath();
      ctx.fill();

      // 水面高光浪线
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, waterSurfaceY);
      for (let i = 0; i <= steps; i++) {
        const x = width * (i / steps);
        const yOffset = Math.sin(wavePhase + (i / steps) * 4 * Math.PI) * 5;
        ctx.lineTo(x, waterSurfaceY + yOffset);
      }
      ctx.stroke();

      // 绘制空气区堆积的死泡泡（灰暗石化浮沫感）
      for (const db of deadBubbles) {
        if (db.isPopping) continue;
        ctx.save();
        ctx.translate(db.x, db.y);

        // 死泡径向渐变
        const deadGrad = ctx.createRadialGradient(
          -db.radius * 0.3, -db.radius * 0.3, 2,
          0, 0, db.radius
        );
        deadGrad.addColorStop(0, 'rgba(148, 163, 184, 0.6)');
        deadGrad.addColorStop(0.5, 'rgba(71, 85, 105, 0.7)');
        deadGrad.addColorStop(1, 'rgba(15, 23, 42, 0.95)');
        ctx.fillStyle = deadGrad;
        ctx.beginPath();
        ctx.arc(0, 0, db.radius, 0, Math.PI * 2);
        ctx.fill();

        // 灰暗外圈与微裂纹
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // 绘制错词文字（灰白）
        ctx.fillStyle = 'rgba(226, 232, 240, 0.85)';
        ctx.font = 'bold 10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(db.word, 0, 0);

        ctx.restore();
      }

      // 绘制弹道飞行物（金针 & 水雷）
      for (const p of projectiles) {
        if (p.type === 'needle') {
          // 向上金针
          ctx.save();
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 3.5;
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y + 24);
          ctx.stroke();
          ctx.restore();
        } else if (p.type === 'mine') {
          // 红色水雷
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.fillStyle = '#ef4444';
          ctx.shadowColor = '#f87171';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(0, 0, 11, 0, Math.PI * 2);
          ctx.fill();
          // 水雷刺角
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          for (let k = 0; k < 6; k++) {
            const a = k * Math.PI / 3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // 绘制粒子
      for (const p of particles) {
        ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${Math.max(0, p.life / p.maxLife)})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制浮字
      for (const ft of floatTexts) {
        ctx.save();
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = Math.max(0, ft.life);
        ctx.font = 'bold 16px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 6;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
