<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>首页方案一 · 小馋怪蹲在底部（数字居中）</title>
<link rel="stylesheet" href="monster_home.css">
<style>
  /* 方案一专属：数字居中，小馋怪从底部探身当"陪伴 / 对手" */
  .core {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding-bottom: 26px;
  }

  .core .bar { width: 236px; margin-top: 8px; }
  .core .meta-line { display: flex; align-items: baseline; gap: 4px; }

  .core .meta-num {
    font-family: var(--num);
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: -0.3px;
  }

  .mate {
    height: 224px;
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    position: relative;
    z-index: 2;
  }

  .mate .monster { width: 200px; height: 200px; }
  .mate .monster img { filter: drop-shadow(0 10px 18px rgba(180, 120, 80, 0.16)); }

  .mate-talk { flex: 1; padding-bottom: 44px; }

  .mate-talk b {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.1px;
  }

  .mate-talk span {
    display: block;
    margin-top: 5px;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ink-faint);
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="device-mockup" data-pose="hold">
  <div class="screen">

    <div class="topbar">
      <div class="day-line">TODAY · 第 <b>137</b> 个背词日</div>
      <div class="topbar-icons">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a1.6 1.6 0 0 0-1.6-1.6H5.5A1.5 1.5 0 0 1 4 15.9z"/>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a1.6 1.6 0 0 1 1.6-1.6h4.9A1.5 1.5 0 0 0 20 15.9z"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/>
        </svg>
      </div>
    </div>

    <div class="core">
      <div class="label">今日目标</div>
      <div class="num-row"><span class="num-hero">120</span><span class="num-unit">词</span></div>
      <div class="bar"><i class="done" style="width: 15%"></i></div>
      <div class="meta-line"><span class="meta-num">18</span><span class="faint-num">/ 120 词</span></div>
      <div class="faint">新词 42 · 旧词 78</div>
    </div>

    <div class="mate">
      <div class="monster">
        <img class="pose pose-hold" src="img/monster/hold_strawberry.png" alt="小馋怪抱着草莓">
        <img class="pose pose-walk" src="img/monster/walk_front.png" alt="">
        <img class="pose pose-cry" src="img/monster/cry.png" alt="">
      </div>
      <div class="mate-talk">
        <b>它还想吃 102 个词</b>
        <span>没学完，它就抱走了</span>
      </div>
    </div>

    <button class="cta">开始今天的 120 个词</button>

    <div class="tabbar">
      <div class="tab on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a1.6 1.6 0 0 0-1.6-1.6H5.5A1.5 1.5 0 0 1 4 15.9z"/>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a1.6 1.6 0 0 1 1.6-1.6h4.9A1.5 1.5 0 0 0 20 15.9z"/>
        </svg>
        学习
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6h11M8 12h11M8 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>
        </svg>
        词表
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6 20 20"/>
        </svg>
        查词
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4l2.4 4.6 5.1.8-3.7 3.6.9 5.1-4.7-2.4-4.7 2.4.9-5.1L4.5 9.4l5.1-.8z"/>
        </svg>
        比赛
      </div>
      <div class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="8.5" r="3.6"/><path d="M5.5 19.5c0-3.3 2.9-5.4 6.5-5.4s6.5 2.1 6.5 5.4"/>
        </svg>
        我
      </div>
    </div>

  </div>
</div>

<div class="notes">
  <h3>方案一 · 小馋怪蹲在底部（信息最清晰）</h3>
  数字与进度仍居中当主信息，小馋怪从页面底部探身抱着草莓，右侧一句话把它的立场说清（它要吃掉你今天没学完的部分）。<br>
  角色是<b>氛围与情感</b>，不承担进度表达——最稳，改动也最小。<br><br>
  <h3>素材</h3>
  形象取 <code>assets/images/monster/cutout/xiaochanguai_抱草莓_橙黄双叶版.png</code>（另有走路、捂脸、背影、泡泡四张备用，可做状态切换）。
</div>

</body>
</html>
