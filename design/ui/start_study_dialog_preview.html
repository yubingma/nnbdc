<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>开始学习确认弹窗 - 扇贝温润美学设计</title>
  <style>
    :root {
      --bg: #F6F9F8;
      --card-bg: #FFFFFF;
      --card-subtle: #F0F6F3;
      --card-border: #E1EFEA;
      
      --text-primary: #152724;
      --text-secondary: #425B57;
      --text-muted: #789691;
      
      --primary: #18BA7C;
      --primary-hover: #15A56E;
      --primary-soft: #EDF8F3;
      
      --amber-text: #D97706;
      --amber-bg: #FFF8E6;
      --amber-border: #FDE68A;

      --dialog-overlay: rgba(15, 28, 25, 0.45);
      --dialog-shadow: 0 20px 48px rgba(18, 38, 33, 0.16), 0 4px 12px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg: #0C1312;
      --card-bg: #131E1C;
      --card-subtle: #192C27;
      --card-border: rgba(255, 255, 255, 0.09);
      
      --text-primary: #EAF7F4;
      --text-secondary: #8EA8A3;
      --text-muted: #5B7A75;

      --primary: #2CD88F;
      --primary-hover: #26C07F;
      --primary-soft: rgba(44, 216, 143, 0.12);

      --amber-text: #FBBF24;
      --amber-bg: rgba(217, 119, 6, 0.15);
      --amber-border: rgba(251, 191, 36, 0.3);

      --dialog-overlay: rgba(0, 0, 0, 0.65);
      --dialog-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #DFE7E4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px;
      color: var(--text-primary);
      transition: background-color 0.3s;
    }

    .designer-toolbar {
      width: 100%;
      max-width: 392px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: #35534E;
    }

    .theme-toggle-btn {
      background: #FFFFFF;
      border: 1px solid #CFDDD8;
      color: #24413C;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    /* 手机外壳容器 */
    .phone-container {
      width: 100%;
      max-width: 392px;
      height: 844px;
      background-color: var(--bg);
      border-radius: 38px;
      box-shadow: 0 24px 60px rgba(18, 38, 33, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 蒙层 Backdrop */
    .dialog-backdrop {
      position: absolute;
      inset: 0;
      background: var(--dialog-overlay);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }

    /* 温润卡片对话框 */
    .confirm-dialog-card {
      width: 100%;
      max-width: 320px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px 20px;
      box-shadow: var(--dialog-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: dialogPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes dialogPop {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 顶部图标展台 */
    .dialog-icon-badge {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: var(--primary-soft);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 14px;
    }
    .dialog-icon-badge svg {
      width: 26px;
      height: 26px;
    }

    /* 标题与描述 */
    .dialog-title {
      font-size: 17.5px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      margin-bottom: 8px;
    }

    .dialog-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* 提醒微容器 */
    .dialog-notice-box {
      width: 100%;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      text-align: left;
      margin-bottom: 20px;
    }

    .notice-icon {
      color: var(--amber-text);
      flex-shrink: 0;
      margin-top: 1px;
    }

    .notice-text {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.45;
      font-weight: 500;
    }

    /* 底部按钮栏 */
    .dialog-actions {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .btn-cancel {
      flex: 1;
      height: 44px;
      border-radius: 22px;
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .btn-cancel:active {
      transform: scale(0.97);
    }

    .btn-confirm {
      flex: 1.25;
      height: 44px;
      border-radius: 22px;
      background: var(--primary);
      border: none;
      color: #FFFFFF;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(24, 186, 124, 0.35);
      transition: all 0.15s;
    }
    [data-theme="dark"] .btn-confirm {
      color: #0C1312;
    }
    .btn-confirm:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- 设计器切换栏 -->
  <div class="designer-toolbar">
    <span class="toolbar-title">🌿 开始学习确认弹窗 - 温润设计</span>
    <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 切换深色模式</button>
  </div>

  <!-- 手机外壳 -->
  <div class="phone-container">
    
    <!-- 模拟背景（模糊背单词准备页） -->
    <div style="padding: 24px; opacity: 0.25; filter: blur(2px);">
      <div style="font-size: 24px; font-weight: 800; margin-bottom: 20px;">今日计划</div>
      <div style="height: 120px; background: var(--card-bg); border-radius: 18px; margin-bottom: 14px;"></div>
      <div style="height: 200px; background: var(--card-bg); border-radius: 18px; margin-bottom: 14px;"></div>
    </div>

    <!-- 弹窗层 -->
    <div class="dialog-backdrop">
      <div class="confirm-dialog-card">
        
        <!-- 图标展台 -->
        <div class="dialog-icon-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
        </div>

        <!-- 标题与说明 -->
        <div class="dialog-title">开启今日学习旅程</div>
        <div class="dialog-desc">今日学习计划已就绪，准备好专注背单词了吗？</div>

        <!-- 温馨提示微卡片 -->
        <div class="dialog-notice-box">
          <svg class="notice-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <div class="notice-text">一旦开启，今日的单词量与测评环节将锁定生效，助你保持专注节奏。</div>
        </div>

        <!-- 双操作按钮 -->
        <div class="dialog-actions">
          <button class="btn-cancel">稍等修改</button>
          <button class="btn-confirm">
            <span>马上开始</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

      </div>
    </div>

  </div>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }
  </script>
</body>
</html>
