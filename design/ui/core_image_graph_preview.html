<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核心意象·引申辐射图原型 - NBDC</title>
  <style>
    :root {
      --bg-canvas: #0d0f12;
      --bg-card: rgba(26, 30, 38, 0.75);
      --bg-card-hover: rgba(36, 42, 54, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(0, 230, 184, 0.5);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --accent-cyan: #00e6b8;
      --accent-gold: #f59e0b;
      --accent-blue: #38bdf8;
      --accent-glow: rgba(0, 230, 184, 0.15);
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    [data-theme="light"] {
      --bg-canvas: #f4f6f8;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 0.98);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-active: rgba(14, 165, 133, 0.5);
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-tertiary: #9ca3af;
      --accent-cyan: #0d9488;
      --accent-gold: #d97706;
      --accent-blue: #0284c7;
      --accent-glow: rgba(13, 148, 136, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-stack);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
    }

    /* 顶部控制栏 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 440px;
      margin-bottom: 16px;
    }

    .word-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .word-tab {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
    }

    .word-tab:hover {
      color: var(--text-primary);
    }

    .word-tab.active {
      background: var(--accent-cyan);
      color: #0d0f12;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 真机卡片容器 (对标 393px iPhone 比例) */
    .phone-container {
      width: 100%;
      max-width: 412px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 36px;
      padding: 20px 16px 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 单词标题区 */
    .word-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .word-title-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .word-spell {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .word-phonetic {
      font-size: 14px;
      color: var(--text-secondary);
      font-family: ui-monospace, monospace;
    }

    .tag-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-glow);
      color: var(--accent-cyan);
      border: 1px solid var(--border-active);
    }

    /* 拓扑图画板区域 */
    .graph-stage {
      position: relative;
      width: 100%;
      height: 380px;
      margin: 8px 0 12px;
      overflow: visible;
    }

    /* SVG 连线层 */
    .svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .bezier-link {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1.5;
      stroke-dasharray: 4 3;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bezier-link.active {
      stroke: var(--accent-cyan);
      stroke-width: 2.2;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 6px var(--accent-cyan));
    }

    /* 中心核心意象卡片 */
    .core-hub {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(30, 36, 48, 0.95), rgba(16, 20, 26, 0.98));
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 14px rgba(0, 230, 184, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      z-index: 3;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .core-hub::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.25;
      transition: opacity 0.3s;
    }

    .core-hub:hover {
      transform: translate(-50%, -50%) scale(1.04);
      box-shadow: 0 0 28px rgba(0, 230, 184, 0.3);
    }

    .core-hub-icon {
      font-size: 18px;
      margin-bottom: 2px;
      z-index: 2;
    }

    .core-hub-tag {
      font-size: 9px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      font-weight: 700;
      margin-bottom: 2px;
      z-index: 2;
    }

    .core-hub-title {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      z-index: 2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 外围释义节点 */
    .meaning-node {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(26, 30, 38, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .meaning-node:hover {
      border-color: var(--border-active);
      transform: translate(-50%, -50%) scale(1.04);
      background: var(--bg-card-hover);
    }

    .meaning-node.active {
      border-color: var(--accent-cyan);
      background: rgba(0, 230, 184, 0.12);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .node-pos {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-gold);
      background: rgba(245, 158, 11, 0.12);
      padding: 1px 5px;
      border-radius: 4px;
    }

    .node-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* 连线上的关系胶囊 (Connection Badge) */
    .edge-label {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(18, 22, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 9.5px;
      color: var(--text-secondary);
      max-width: 120px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      z-index: 2;
      pointer-events: auto;
      transition: all 0.2s;
    }

    .edge-label.active {
      color: #fff;
      border-color: var(--accent-cyan);
      background: rgba(0, 230, 184, 0.25);
      font-weight: 500;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* 底部引申透彻解读面板 */
    .detail-sheet {
      background: rgba(20, 24, 32, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 16px;
      margin-top: 4px;
      transition: all 0.3s ease;
    }

    .detail-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .detail-tag {
      font-size: 11px;
      color: var(--accent-cyan);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .detail-hint {
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .detail-content {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    .detail-highlight {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* 示意例句 */
    .example-quote {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-subtle);
      font-size: 12px;
      color: var(--text-tertiary);
    }
    .example-quote b {
      color: var(--accent-cyan);
    }

    /* 底部提示 */
    .footer-tip {
      text-align: center;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- 控制栏：单词切换与模式 -->
  <div class="header-bar">
    <div class="word-tabs" id="tabs">
      <div class="word-tab active" onclick="switchWord('spring')">spring</div>

      <div class="word-tab" onclick="switchWord('scale')">scale</div>
      <div class="word-tab" onclick="switchWord('fine')">fine</div>

    <button class="tool-btn" onclick="toggleTheme()">🌓 模式</button>

      <div id="nodes-layer"></div>

    <!-- 底部解读面板 -->
    <div class="detail-sheet">
      <div class="detail-sheet-header">

      <div class="example-quote" id="sheet-example" style="display: none;"></div>
    </div>

    <div class="footer-tip">轻触任一节点高亮引申脉络 · 原生贝塞尔曲线自适应排版</div>
  </div>

        branches: [
          { pos: "adj.", meaning: "晴朗的天气", angle: -140, relation: "大气经过提纯无云无杂质", desc: "天气达到最佳极限状态：万里无云、透明度高，是空气最纯净的样子。", example: "I hope we have <b>fine</b> weather tomorrow." },
          { pos: "adj.", meaning: "精细细微的", angle: -35, relation: "颗粒线条被提纯到极微小", desc: "物理颗粒或工艺线条被研磨、雕琢到极小的极致状态（如 fine sand, fine art）。", example: "The craftsman used a <b>fine</b> paintbrush." },
          { pos: "adj.", meaning: "健康的/安好", angle: 45, relation: "身体调养达到极致平衡", desc: "身体机能处于无病无痛的良好端点状态，或事物品质上佳让人欣慰。", example: "Don't worry, everything will be <b>fine</b>." },
          { pos: "v.", meaning: "处以罚款", angle: 135, relation: "付款使纠纷“画上终点”", desc: "源自 finis（终点），古代付钱来“了结/结清”法律诉讼，使争端抵达终点。", example: "He was <b>fined</b> $200 for speeding." }
        ]
      }
    };

    let currentWord = "spring";
    let activeIndex = null;

    function renderGraph() {
      const data = DATA[currentWord];
      document.getElementById('spell').innerText = data.spell;
      document.getElementById('phonetic').innerText = data.phonetic;
      document.getElementById('hub-icon').innerText = data.icon;
      document.getElementById('hub-title').innerText = data.coreImage;

      const hub = document.getElementById('core-hub');
      if (data.bgImage) {
        hub.style.backgroundImage = `radial-gradient(circle, rgba(16,20,26,0.85), rgba(16,20,26,0.95)), url('${data.bgImage}')`;
      } else {
        hub.style.backgroundImage = 'none';
      }

      const stage = document.getElementById('stage');
      const stageW = stage.clientWidth;
      const stageH = stage.clientHeight;
      const cx = stageW / 2;
      const cy = stageH / 2;
      const radiusX = stageW * 0.38;
      const radiusY = stageH * 0.40;

      const svg = document.getElementById('svg-layer');
      svg.innerHTML = '';
      const nodesLayer = document.getElementById('nodes-layer');
      nodesLayer.innerHTML = '';
      const labelsLayer = document.getElementById('labels-layer');
      labelsLayer.innerHTML = '';

      data.branches.forEach((b, i) => {
        const rad = (b.angle * Math.PI) / 180;
        const nx = cx + Math.cos(rad) * radiusX;
        const ny = cy + Math.sin(rad) * radiusY;

        // 计算贝塞尔曲线控制点
        const curveOffset = 12;
        const perpX = -Math.sin(rad) * curveOffset;
        const perpY = Math.cos(rad) * curveOffset;
        const mx = (cx + nx) / 2 + perpX;
        const my = (cy + ny) / 2 + perpY;

        // 1. 创建 SVG 连线
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const d = `M ${cx} ${cy} Q ${mx} ${my} ${nx} ${ny}`;
        path.setAttribute('d', d);
        path.setAttribute('class', `bezier-link link-${i} ${activeIndex === i ? 'active' : ''}`);
        svg.appendChild(path);

        // 2. 连线中间的引申逻辑胶囊标签 (放在距离中心 56% 的位置，避免撞中心 hub)
        const lx = cx * 0.44 + nx * 0.56 + perpX * 0.8;
        const ly = cy * 0.44 + ny * 0.56 + perpY * 0.8;
        const label = document.createElement('div');
        label.className = `edge-label label-${i} ${activeIndex === i ? 'active' : ''}`;
        label.style.left = `${lx}px`;
        label.style.top = `${ly}px`;
        label.innerText = b.relation;
        label.onclick = (e) => { e.stopPropagation(); selectNode(i); };
        labelsLayer.appendChild(label);

        // 3. 外围释义节点卡片
        const node = document.createElement('div');
        node.className = `meaning-node node-${i} ${activeIndex === i ? 'active' : ''}`;
        node.style.left = `${nx}px`;
        node.style.top = `${ny}px`;
        node.innerHTML = `<span class="node-pos">${b.pos}</span><span class="node-text">${b.meaning}</span>`;
        node.onclick = (e) => { e.stopPropagation(); selectNode(i); };
        nodesLayer.appendChild(node);
      });

      updateSheet();
    }

    function selectNode(index) {
      if (activeIndex === index) {
        resetActive();
        return;
      }
      activeIndex = index;
      renderGraph();
    }

    function resetActive() {
      activeIndex = null;
      renderGraph();
    }

    function updateSheet() {
      const data = DATA[currentWord];
      const titleEl = document.getElementById('sheet-title');
      const subEl = document.getElementById('sheet-sub');
      const descEl = document.getElementById('sheet-desc');
      const exEl = document.getElementById('sheet-example');

      if (activeIndex !== null) {
        const branch = data.branches[activeIndex];
        titleEl.innerHTML = `🌟 [${branch.pos}] ${branch.meaning} 为什么与核心意象相通？`;
        subEl.innerText = `引申纽带: ${branch.relation}`;
        descEl.innerHTML = branch.desc;
        if (branch.example) {
          exEl.style.display = 'block';
          exEl.innerHTML = `<b>语境例句：</b>${branch.example}`;
        } else {
          exEl.style.display = 'none';
        }
      } else {
        titleEl.innerHTML = `💡 核心意象动势：${data.coreImage}`;
        subEl.innerText = "点击任意节点激活对应引申链";
        descEl.innerHTML = `${data.schemaDesc}<br><span style="color:var(--text-tertiary); font-size:12px; margin-top:4px; display:inline-block;">周围所有看似不相关的释义，都是由该原点动势在不同生活与物理场景下引申而来。</span>`;
        exEl.style.display = 'none';
      }
    }

    function switchWord(spell) {
      currentWord = spell;
      activeIndex = null;
      document.querySelectorAll('.word-tab').forEach(tab => {
        tab.classList.toggle('active', tab.innerText === spell);
      });
      renderGraph();
    }

    function toggleTheme() {
      const isDark = document.body.getAttribute('data-theme') !== 'light';
      document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      renderGraph();
    }

    window.addEventListener('resize', renderGraph);
    window.addEventListener('DOMContentLoaded', () => {
      renderGraph();
    });
  </script>
</body>
</html>
