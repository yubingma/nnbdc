<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>绛紫夜岚 · 主题预览（浅色）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ 绛紫夜岚 浅色主题令牌（与 app/lib/theme/app_theme.dart 严格一致） ============ */
  .phone-container {
    --primary: #C44BE0;
    --primary-light: #E6A5F3;
    --primary-dark: #9A28C4;
    --text-primary: #2E163B;
    --text-secondary: #6B4A80;
    --text-muted: #9A7FB0;
    --bg-top: #CEC2D1;
    --bg-mid: #B3A1B8;
    --bg-bottom: #997F9F;
    --card-bg: rgba(255, 255, 255, 0.5);
    --subtle-bg: rgba(196, 75, 224, 0.10);
    --warm: #FF9E5C;
    /* 语义微色谱（不随主题变化的固定语义色） */
    --c-new: #0EA5E9;
    --c-review: #0D9488;
    --c-learn: #3B82F6;
    --c-master: #10B981;

    width: 393px;
    height: 852px;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
    background: var(--bg-mid);
  }

  /* 全屏浅色薰衣草渐变背景（AppThemeBackground 浅色·莫兰迪单色渐变） */
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(
      180deg,
      var(--bg-top) 0%,
      var(--bg-mid) 55%,
      var(--bg-bottom) 100%
    );
  }
  /* 左上一团柔紫光晕，复现参考图「质感」又保持清透 */
  .bg::before {
    content: "";
    position: absolute;
    left: -40px;
    top: 40px;
    width: 320px;
    height: 300px;
    background: radial-gradient(circle, rgba(196, 75, 224, 0.14) 0%, rgba(196, 75, 224, 0.0) 70%);
    filter: blur(6px);
  }

  .screen {
    position: relative;
    z-index: 1;
    flex: 1;
    padding: 14px 20px 90px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶部品牌与标题 ---------- */
  .brand { font-size: 11.5px; letter-spacing: .4px; color: var(--text-muted); font-weight: 400; }
  .head-row { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
  .head-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
  .head-date { font-size: 12px; color: var(--text-secondary); }

  /* ---------- 指标卡片 2x2 ---------- */
  .metric-grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .metric {
    height: 108px;
    padding: 14px 14px 12px;
    border-radius: 20px;
    background: var(--card-bg);
    border: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 30px rgba(60, 20, 80, 0.10), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .metric-top { display: flex; justify-content: space-between; align-items: center; }
  .metric-ico { width: 20px; height: 20px; }
  .metric-arrow { color: var(--text-muted); opacity: .5; }
  .metric-bottom { display: flex; justify-content: space-between; align-items: baseline; }
  .metric-label { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }
  .metric-num { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; font-family: Roboto, -apple-system, sans-serif; }

  /* ---------- 主按钮 ---------- */
  .primary-btn {
    margin-top: 22px;
    height: 50px;
    border-radius: 16px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    box-shadow: 0 12px 28px -6px rgba(196, 75, 224, 0.45);
  }

  /* ---------- 书桌词书 分组卡片 ---------- */
  .section-title { margin-top: 26px; font-size: 15px; font-weight: 600; letter-spacing: -0.2px; color: var(--text-primary); }
  .section-action { font-size: 12.5px; font-weight: 500; color: var(--primary); }
  .book-card {
    margin-top: 12px;
    border-radius: 18px;
    background: var(--card-bg);
    border: 1px solid rgba(0, 0, 0, 0.05);
    padding: 15px 16px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 30px rgba(60, 20, 80, 0.10), inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .book-head { display: flex; justify-content: space-between; align-items: center; }
  .book-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.1px; color: var(--text-primary); }
  .book-count { font-size: 13px; color: var(--text-secondary); font-family: Roboto, sans-serif; }
  .book-sub { margin-top: 4px; font-size: 11.5px; color: var(--text-muted); }
  .progress { margin-top: 10px; height: 3.5px; border-radius: 100px; background: rgba(0,0,0,0.06); overflow: hidden; display: flex; }
  .progress .p { height: 100%; width: 62%; background: var(--primary); border-radius: 100px; }
  .progress .r { height: 100%; width: 30%; background: rgba(196, 75, 224, 0.42); border-radius: 100px; margin-left: 2px; }

  /* ---------- Chip 选中态 ---------- */
  .chips { margin-top: 16px; display: flex; gap: 8px; }
  .chip {
    font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 16px;
    color: var(--text-primary); background: rgba(255,255,255,0.45); border: 1px solid rgba(0,0,0,0.08);
  }
  .chip.on { color: #fff; background: rgba(196, 75, 224, 0.14); border: 1.5px solid var(--primary); box-shadow: 0 4px 14px rgba(196,75,224,0.28); }

  /* ---------- 色板 ---------- */
  .palette { margin-top: 26px; }
  .palette-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .swatch { border-radius: 12px; padding: 7px 8px; background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.05); }
  .swatch .dot { width: 20px; height: 20px; border-radius: 7px; }
  .swatch .label { margin-top: 5px; font-size: 9.5px; color: var(--text-secondary); }
  .swatch .hex { font-size: 9px; color: var(--text-muted); font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <div class="phone-container">
    <div class="bg"></div>
    <div class="screen">
      <div class="brand">绛紫夜岚 · PLUM</div>
      <div class="head-row">
        <div class="head-title">今日学习</div>
        <div class="head-date">9月9日 · 周二</div>
      </div>

      <!-- 2x2 指标卡片 -->
      <div class="metric-grid">
        <div class="metric">
          <div class="metric-top"><svg class="metric-ico" viewBox="0 0 24 24" fill="none" stroke="#0EA5E9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="metric-arrow">›</span></div>
          <div class="metric-bottom"><span class="metric-label">今日新词</span><span class="metric-num" style="color:var(--text-primary)">12</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><svg class="metric-ico" viewBox="0 0 24 24" fill="none" stroke="#0D9488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg><span class="metric-arrow">›</span></div>
          <div class="metric-bottom"><span class="metric-label">今日复习</span><span class="metric-num" style="color:var(--text-primary)">48</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><svg class="metric-ico" viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg><span class="metric-arrow">›</span></div>
          <div class="metric-bottom"><span class="metric-label">核心学习中</span><span class="metric-num" style="color:var(--text-primary)">120</span></div>
        </div>
        <div class="metric">
          <div class="metric-top"><svg class="metric-ico" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span class="metric-arrow">›</span></div>
          <div class="metric-bottom"><span class="metric-label">核心已掌握</span><span class="metric-num" style="color:var(--text-primary)">4428</span></div>
        </div>
      </div>

      <button class="primary-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        开始学习
      </button>

      <!-- 书桌词书 -->
      <div class="head-row" style="margin-top:26px;margin-bottom:0;">
        <div class="section-title" style="margin-top:0;">我的书桌</div>
        <div class="section-action">选词书 ›</div>
      </div>
      <div class="book-card">
        <div class="book-head"><span class="book-name">考研英语 · 核心词汇</span><span class="book-count">4428 词 ›</span></div>
        <div class="book-sub">已掌握 2860 · 已取 3900 · 65%</div>
        <div class="progress"><div class="p"></div><div class="r"></div></div>
      </div>

      <!-- Chip 选中态 -->
      <div class="chips">
        <div class="chip on">美音 (_us)</div>
        <div class="chip">英音 (_uk)</div>
      </div>

      <!-- 色板 -->
      <div class="palette">
        <div class="section-title" style="margin-top:0;">主题色板</div>
        <div class="palette-grid">
          <div class="swatch"><div class="dot" style="background:#C44BE0"></div><div class="label">主色</div><div class="hex">#C44BE0</div></div>
          <div class="swatch"><div class="dot" style="background:#E6A5F3"></div><div class="label">主色亮</div><div class="hex">#E6A5F3</div></div>
          <div class="swatch"><div class="dot" style="background:#9A28C4"></div><div class="label">主色深</div><div class="hex">#9A28C4</div></div>
          <div class="swatch"><div class="dot" style="background:#2E163B"></div><div class="label">正文</div><div class="hex">#2E163B</div></div>
          <div class="swatch"><div class="dot" style="background:#6B4A80"></div><div class="label">次文</div><div class="hex">#6B4A80</div></div>
          <div class="swatch"><div class="dot" style="background:#9A7FB0"></div><div class="label">弱文</div><div class="hex">#9A7FB0</div></div>
          <div class="swatch"><div class="dot" style="background:#CEC2D1"></div><div class="label">背景顶</div><div class="hex">#CEC2D1</div></div>
          <div class="swatch"><div class="dot" style="background:#B3A1B8"></div><div class="label">背景中</div><div class="hex">#B3A1B8</div></div>
          <div class="swatch"><div class="dot" style="background:#997F9F"></div><div class="label">背景底</div><div class="hex">#997F9F</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
