<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>今日学习计划 · 极简排版优化原型</title>
  <style>
    :root {
      /* 清新薄荷氛围背景：非对称双光源，带一点点通透的青色光晕 */
      --bg:
        radial-gradient(circle at 88% 6%, rgba(167, 243, 208, 0.55) 0%, transparent 40%),
        radial-gradient(circle at 4% 34%, rgba(255, 255, 255, 0.95) 0%, transparent 52%),
        radial-gradient(circle at 55% 110%, rgba(204, 251, 241, 0.5) 0%, transparent 50%),
        #E2ECE7;

      /* 第一层毛玻璃卡片：卡面 + 极淡描边 + 柔和投影（拉开明度让卡片真正浮起） */
      --card-bg: rgba(255, 255, 255, 0.66);
      --card-edge: rgba(255, 255, 255, 0.22);
      --card-shadow: 0 20px 44px -14px rgba(28, 66, 50, 0.2), 0 4px 12px -4px rgba(28, 66, 50, 0.05);

      --divider: rgba(20, 60, 45, 0.07);
      --hairline: rgba(20, 60, 45, 0.06);

      --text-primary: #14231E;
      --text-secondary: #48605A;
      --text-muted: #7C948D;
      --text-faint: #A7BBB5;

      /* 主题强调色（主按钮 / 轨道主线） */
      --accent: #10B981;
      --accent-hover: #0EA271;
      --accent-ink: #FFFFFF;

      /* 语义微色谱 */
      --new-word: #0EA5E9;   /* 今日新词 · 明快天蓝 */
      --old-word: #0D9488;   /* 今日旧词 · 沉静青碧 */
      --correct: #10B981;    /* 答对 */
      --wrong: #E8543B;      /* 答错 */

      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #DDE4E0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    /* 统一真机容器（与 render_mockup_png.js 对齐：393x852） */
    .device-mockup {
      width: 100%;
      max-width: 393px;
      height: 852px;
      max-height: 852px;
      background: var(--bg);
      border-radius: 54px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 状态栏 */
    .status-bar {
      height: 48px;
      flex-shrink: 0;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
      z-index: 5;
    }

    /* 主内容区 */
    .app-body {
      flex: 1;
      padding: 10px 22px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow: hidden;
    }

    /* ===== 极简顶栏 ===== */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 2px;
    }
    .header-greeting {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      margin-bottom: 3px;
    }
    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }
    .header-info-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--card-edge);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      box-shadow: 0 2px 8px rgba(28, 66, 50, 0.05);
    }

    /* ===== 毛玻璃主卡片：指标仪表盘 ===== */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 26px;
      padding: 26px 26px 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* 今日目标大数字 */
    .goal-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .goal-number-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .goal-number {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      color: var(--text-primary);
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
    }
    .goal-unit {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .goal-unit svg { color: var(--text-faint); }
    .goal-caption {
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text-muted);
    }

    /* 进度条 */
    .progress-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .progress-track {
      height: 4px;
      width: 100%;
      background: var(--hairline);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 3.7%;
      background: var(--accent);
      border-radius: 6px;
    }

    /* 双列指标：新词 / 旧词（语义色：天蓝 / 青碧） */
    .metrics-row {
      display: flex;
      align-items: stretch;
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
    }
    .metric-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 14px 0;
    }
    .metric-col + .metric-col {
      border-left: 1px solid var(--divider);
    }
    .metric-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Roboto", sans-serif;
    }
    .metric-col.new .metric-value { color: var(--new-word); }
    .metric-col.old .metric-value { color: var(--old-word); }
    .metric-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .metric-label svg { color: var(--text-faint); }

    /* 主按钮：继续学习 */
    .btn-continue {
      width: 100%;
      height: 52px;
      border-radius: 26px;
      border: none;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 24px -6px rgba(16, 185, 129, 0.5);
      transition: all 0.18s ease;
    }
    .btn-continue:hover { background: var(--accent-hover); transform: translateY(-1px); }
    .btn-continue:active { transform: scale(0.985); }

    /* ===== 学习轨道 ===== */
    .section-block { display: flex; flex-direction: column; gap: 14px; }
    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }
    .section-heading {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    /* 次级行动：轻量行内文字链接（非胶囊按钮） */
    .text-action {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .text-action:hover { color: var(--text-primary); }

    /* 一体化分组大卡（新词轨道 + 旧词轨道），发丝分割线隔开 */
    .track-group-card {
      background: var(--card-bg);
      border: 1px solid var(--card-edge);
      box-shadow: var(--card-shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      padding: 6px 22px;
    }

    .track-section {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 14px;
      align-items: center;
      padding: 20px 0;
    }
    .track-section + .track-section { border-top: 1px solid var(--divider); }

    /* 左侧：测评起点（纯文本，无容器） */
    .track-origin { min-width: 0; }
    .track-origin-tag {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .track-origin-name {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    /* 右侧：分支结果（纯排版 + 语义色） */
    .track-branches {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .branch-row {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .branch-state {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .branch-state.correct { color: var(--correct); }
    .branch-state.wrong { color: var(--wrong); }
    .branch-state svg { width: 13px; height: 13px; }
    .branch-arrow {
      color: var(--text-faint);
      font-size: 11px;
      flex-shrink: 0;
    }
    .branch-outcome {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .branch-outcome.done { color: var(--text-muted); }

    /* 底部提示 */
    .tip-bottom {
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--text-faint);
      margin-top: -4px;
    }

    /* 设计师小注（仅浏览器预览用，render 脚本会隐藏） */
    .design-notes {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(20, 35, 30, 0.88);
      color: #fff;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 手机预览容器 -->
  <div class="device-mockup">
    <!-- 状态栏 -->
    <div class="status-bar">
      <span>23:20</span>
      <div style="display: flex; gap: 6px; align-items: center;">
        <span>5G</span>
        <span>100%</span>
      </div>
    </div>

    <div class="app-body">

      <!-- 极简顶栏 -->
      <div class="app-header">
        <div>
          <div class="header-greeting">TODAY'S PLAN</div>
          <div class="header-title">今日学习计划</div>
        </div>
        <button class="header-info-btn" title="查看业务日期与系统时间">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
      </div>

      <!-- ===== 毛玻璃主卡片：指标仪表盘 ===== -->
      <div class="hero-card">
        <!-- 今日目标大数字 -->
        <div class="goal-block">
          <div class="goal-number-wrap">
            <div class="goal-number">500</div>
            <div class="goal-unit">
              词
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </div>
          </div>
          <div class="goal-caption">今日学习目标</div>
        </div>

        <!-- 进度条 -->
        <div class="progress-block">
          <div class="progress-labels">
            <span>今日进度 37 / 1006 步</span>
            <span>3%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill"></div>
          </div>
        </div>

        <!-- 双列指标：新词 / 旧词 -->
        <div class="metrics-row">
          <div class="metric-col new">
            <div class="metric-value">121</div>
            <div class="metric-label">
              新词
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
          </div>
          <div class="metric-col old">
            <div class="metric-value">379</div>
            <div class="metric-label">
              旧词
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
          </div>
        </div>

        <!-- 主按钮 -->
        <button class="btn-continue">
          继续学习
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- ===== 学习轨道 ===== -->
      <div class="section-block">
        <div class="section-header-row">
          <span class="section-heading">学习轨道</span>
          <button class="text-action">
            调整轨道
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </div>

        <!-- 一体化分组大卡：新词轨道 + 旧词轨道 -->
        <div class="track-group-card">
          <!-- 新词轨道 -->
          <div class="track-section" title="新词轨道">
            <div class="track-origin">
              <div class="track-origin-tag">测评</div>
              <div class="track-origin-name">汉译英</div>
            </div>
            <div class="track-branches">
              <div class="branch-row">
                <span class="branch-state correct">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  答对
                </span>
                <span class="branch-arrow">→</span>
                <span class="branch-outcome">汉译英</span>
              </div>
              <div class="branch-row">
                <span class="branch-state wrong">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  答错
                </span>
                <span class="branch-arrow">→</span>
                <span class="branch-outcome">汉译英</span>
              </div>
            </div>
          </div>

          <!-- 旧词轨道 -->
          <div class="track-section" title="旧词轨道">
            <div class="track-origin">
              <div class="track-origin-tag">测评</div>
              <div class="track-origin-name">英译汉</div>
            </div>
            <div class="track-branches">
              <div class="branch-row">
                <span class="branch-state correct">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                  答对
                </span>
                <span class="branch-arrow">→</span>
                <span class="branch-outcome done">直接结束</span>
              </div>
              <div class="branch-row">
                <span class="branch-state wrong">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                  答错
                </span>
                <span class="branch-arrow">→</span>
                <span class="branch-outcome">汉译英</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 底部提示 -->
      <div class="tip-bottom">学习未开始前可随时调整目标 · 开始后将自动锁定</div>
    </div>
  </div>

  <!-- 设计师小注（浏览器预览可见，真机渲染自动隐藏） -->
  <div class="design-notes">✦ 优化版 · 排版驱动 / 无盒中盒 / 语义色</div>
</body>
</html>
