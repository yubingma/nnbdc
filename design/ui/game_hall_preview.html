<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>单词对战大厅 - 现代温润竞技美学原型</title>
  <style>
    :root {
      --bg: #F6F9F8;
      --card-bg: #FFFFFF;
      --card-subtle: #F0F6F3;
      --card-border: #E1EFEA;
      
      --text-primary: #152724;
      --text-secondary: #425B57;
      --text-muted: #789691;
      --text-faint: #B2CDC8;

      /* 扇贝翡翠绿 */
      --primary: #18BA7C;
      --primary-hover: #15A56E;
      --primary-soft: #EDF8F3;
      --primary-border: #D1EADE;
      
      /* 竞技金/琥珀 */
      --gold: #F59E0B;
      --gold-soft: #FFFBEB;
      --gold-border: #FDE68A;

      /* 对战蓝 */
      --blue: #2563EB;
      --blue-soft: #EFF6FF;

      --shadow-card: 0 4px 16px rgba(24, 186, 124, 0.05), 0 1px 3px rgba(0, 0, 0, 0.02);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] {
      --bg: #0C1312;
      --card-bg: #131E1C;
      --card-subtle: #192C27;
      --card-border: rgba(255, 255, 255, 0.08);
      
      --text-primary: #EAF7F4;
      --text-secondary: #8EA8A3;
      --text-muted: #5B7A75;
      --text-faint: #344B48;

      --primary: #2CD88F;
      --primary-hover: #26C07F;
      --primary-soft: rgba(44, 216, 143, 0.12);
      --primary-border: rgba(44, 216, 143, 0.3);

      --gold: #FBBF24;
      --gold-soft: rgba(245, 158, 11, 0.15);
      --gold-border: rgba(251, 191, 36, 0.3);

      --blue: #60A5FA;
      --blue-soft: rgba(37, 99, 235, 0.12);

      --shadow-card: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #DFE7E4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 12px;
      color: var(--text-primary);
      transition: background-color 0.3s;
    }

    /* 顶部控制栏 */
    .designer-toolbar {
      width: 100%;
      max-width: 392px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }

    .toolbar-title {
      font-size: 13px;
      font-weight: 700;
      color: #35534E;
    }

    .theme-toggle-btn {
      background: #FFFFFF;
      border: 1px solid #CFDDD8;
      color: #24413C;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }

    /* 手机外壳容器 */
    .phone-container {
      width: 100%;
      max-width: 392px;
      height: 844px;
      background-color: var(--bg);
      border-radius: 38px;
      box-shadow: 0 24px 60px rgba(18, 38, 33, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 状态栏 */
    .status-bar {
      height: 42px;
      padding: 12px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      z-index: 10;
    }

    /* 顶部标题栏 */
    .app-header {
      padding: 10px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .header-titles {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .header-main-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }

    .header-sub-title {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-rule-btn {
      padding: 5px 10px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 滚动主区域 */
    .scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 顶部快速对战 Hero Banner */
    .hero-quick-match {
      background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-subtle) 100%);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .hero-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      color: var(--gold);
      padding: 2px 7px;
      border-radius: 8px;
      font-size: 10.5px;
      font-weight: 800;
      width: fit-content;
    }

    .hero-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .hero-desc {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .hero-quick-btn {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(24, 186, 124, 0.35);
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
      transition: transform 0.15s;
    }
    [data-theme="dark"] .hero-quick-btn {
      color: #0C1312;
    }
    .hero-quick-btn:active {
      transform: scale(0.96);
    }

    /* 快捷入口双胶囊：开房 / 进房 */
    .quick-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-action-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .quick-action-card:active {
      transform: scale(0.97);
    }

    .action-icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .action-icon-badge.green { background: var(--primary-soft); color: var(--primary); }
    .action-icon-badge.blue  { background: var(--blue-soft); color: var(--blue); }

    .action-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .action-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .action-sub {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    /* 分组模块 */
    .group-wrapper {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: all 0.2s;
    }

    .group-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .group-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-dot {
      width: 4px;
      height: 14px;
      background: var(--primary);
      border-radius: 2px;
    }

    .group-title-text {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .group-count-tag {
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }

    .group-arrow {
      color: var(--text-faint);
      transition: transform 0.25s ease;
    }
    .group-wrapper.open .group-arrow {
      transform: rotate(90deg);
    }

    /* 分组内容区 */
    .group-body {
      padding: 0 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 单个对战大厅卡片 */
    .hall-item-card {
      background: var(--card-subtle);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hall-info-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .hall-icon-box {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      flex-shrink: 0;
    }

    .hall-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .hall-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hall-status-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    .hall-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-sub-action {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-sub-action:active {
      transform: scale(0.95);
    }

    .btn-match-action {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 2px 8px rgba(24, 186, 124, 0.3);
      transition: all 0.15s;
    }
    [data-theme="dark"] .btn-match-action {
      color: #0C1312;
    }
    .btn-match-action:active {
      transform: scale(0.95);
    }

    /* 底部导航栏 */
    .bottom-nav {
      height: 60px;
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      z-index: 10;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      color: var(--text-muted);
    }
    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 设计器切换栏 -->
  <div class="designer-toolbar">
    <span class="toolbar-title">🎮 单词对战大厅 - 现代温润竞技美学</span>
    <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 切换深色模式</button>
  </div>

  <!-- 手机外壳 -->
  <div class="phone-container">
    
    <!-- 顶部状态栏 -->
    <div class="status-bar">
      <span>13:20</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <span>5G</span>
        <span>95%</span>
      </div>
    </div>

    <!-- 顶部大标题栏 -->
    <div class="app-header">
      <div class="header-titles">
        <div class="header-main-title">单词PK大厅</div>
        <div class="header-sub-title">实时对战 · 词汇巅峰竞速</div>
      </div>
      <div class="header-rule-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <span>玩法规则</span>
      </div>
    </div>

    <!-- 滚动主内容 -->
    <div class="scroll-content">

      <!-- 对战大厅分组 1: 考试核心场 -->
      <div class="group-wrapper open">
        <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
          <div class="group-header-left">
            <div class="group-dot"></div>
            <span class="group-title-text">考试大纲核心场</span>
            <span class="group-count-tag">3 个场次</span>
          </div>
          <svg class="group-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="group-body">
          
          <!-- 大厅 1: 考研场 -->
          <div class="hall-item-card">
            <div class="hall-info-left">
              <div class="hall-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              </div>
              <div class="hall-details">
                <div class="hall-name">考研核心词汇竞技场</div>
              </div>
            </div>
            <div class="hall-actions-right">
              <button class="btn-sub-action">进房</button>
              <button class="btn-sub-action">开房</button>
              <button class="btn-match-action">
                <span>匹配</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
            </div>
          </div>

          <!-- 大厅 2: CET-6 -->
          <div class="hall-item-card">
            <div class="hall-info-left">
              <div class="hall-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              </div>
              <div class="hall-details">
                <div class="hall-name">英语六级 CET-6 强化场</div>
              </div>
            </div>
            <div class="hall-actions-right">
              <button class="btn-sub-action">进房</button>
              <button class="btn-sub-action">开房</button>
              <button class="btn-match-action">
                <span>匹配</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
            </div>
          </div>

          <!-- 大厅 3: CET-4 -->
          <div class="hall-item-card">
            <div class="hall-info-left">
              <div class="hall-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              </div>
              <div class="hall-details">
                <div class="hall-name">英语四级 CET-4 新手场</div>
              </div>
            </div>
            <div class="hall-actions-right">
              <button class="btn-sub-action">进房</button>
              <button class="btn-sub-action">开房</button>
              <button class="btn-match-action">
                <span>匹配</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- 4. 对战大厅分组 2: 进阶高频场 -->
      <div class="group-wrapper open">
        <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
          <div class="group-header-left">
            <div class="group-dot" style="background:var(--gold);"></div>
            <span class="group-title-text">出国与进阶高频场</span>
            <span class="group-count-tag">2 个场次</span>
          </div>
          <svg class="group-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </div>

        <div class="group-body">
          <div class="hall-item-card">
            <div class="hall-info-left">
              <div class="hall-icon-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              </div>
              <div class="hall-details">
                <div class="hall-name">托福 TOEFL 核心攻坚场</div>
              </div>
            </div>
            <div class="hall-actions-right">
              <button class="btn-sub-action">进房</button>
              <button class="btn-sub-action">开房</button>
              <button class="btn-match-action">
                <span>匹配</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部导航栏 -->
    <div class="bottom-nav">
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <span class="nav-label">学习</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="nav-label">词表</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span class="nav-label">查词</span>
      </div>
      <div class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
        <span class="nav-label">比赛</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="nav-label">我</span>
      </div>
    </div>

  </div>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }
  </script>
</body>
</html>
