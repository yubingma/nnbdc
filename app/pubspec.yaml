name: nnbdc
description: 泡泡单词 - 智能背单词应用

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# 升级时修改这里
version: 26.10.18+26101801

# 最低支持版本（用于强制升级检查） 
min_ver_code: 26092401

# 版本更新说明（用于构建脚本生成 ver.json）
# 格式：每行一个更新项，以 "- " 开头
changes:
  - "增加小游戏'打哭小馋怪'"
  - "首页体验优化"
  - "修复bug"



environment:
  sdk: ^3.4.0
  # Flutter 工具链版本：本工程唯一声明处。CI 的 Setup Flutter 直接读这一行
  # （.github/workflows/build.yml 的 flutter-version-file），app/.metadata 的 revision 与之一致。
  # 语义是「不低于 3.44.0」：低于此版本时 flutter pub get 会当场报错，
  # 避免老 SDK 静默换掉 meta/characters/test_api/matcher/material_color_utilities 这 5 个
  # 由 Flutter SDK 钉死版本号的包，从而把 pubspec.lock 改成另一副样子。
  flutter: "3.44.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.2
  umeng_common_sdk: ^1.2.6
  umeng_apm_sdk: ^2.3.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  flutter_svg: ^2.0.14
  simple_animations: ^5.1.0
  email_validator: ^3.0.0
  toastification: ^2.3.0
  dio: ^5.7.0
  crypto: ^3.0.3
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0
  retrofit: 4.7.3
  retrofit_generator: 9.3.0
  logger: ^2.5.0 #for logging purpose
  dio_cookie_manager:
  cookie_jar: ^4.0.8
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.8.0
  path_provider: ^2.1.4
  path_provider_platform_interface: ^2.1.2
  go_router: ^14.2.0
  provider: ^6.0.1
  package_info_plus: ^8.0.3
  permission_handler: ^11.3.1
  animated_text_kit: ^4.2.1
  day_night_switcher: ^0.2.0+1
  percent_indicator: ^4.0.0
  confirm_dialog: ^1.0.0
  flutter_reorderable_list: ^1.1.0
  open_file: ^3.2.1
  audio_session: ^0.1.21
  just_audio: ^0.9.42
  flutter_cache_manager: ^3.1.3
  flutter_animation_progress_bar: ^2.0.1
  scrollable_positioned_list: ^0.3.8
  lpinyin: ^2.0.3
  socket_io_client: ^1.0.2
  flame: ^1.2.1
  flame_audio: ^2.10.4
  video_player: ^2.9.2
  flutter_keyboard_visibility: ^6.0.0
  cached_network_image: ^3.4.1
  image_network: ^2.5.6
  flutter_inappwebview: ^6.1.5
  url_launcher: ^6.3.1
  appcheck: ^1.5.2
  chat_bubbles: ^1.3.0
  intl: ^0.20.2
  drift_db_viewer: ^2.1.0
  equatable: ^2.0.7
  flutter_native_splash: ^2.4.3 
  fluwx: ^5.7.5  # 微信登录SDK (需要 Kotlin 2.2.21)
  connectivity_plus: ^6.0.5  # 网络连接检测
  in_app_purchase: ^3.1.11  # iOS/Android 应用内购买

  http: any
  uuid: any
  app_settings: ^6.1.1
  flutter_markdown: ^0.7.7+1
  image_picker: ^1.1.2              # 拍照/选图
  sign_in_with_apple: ^7.0.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  pdf: ^3.10.8
  share_plus: ^10.1.0
  flutter_timezone: ^5.0.2
  app_tracking_transparency: ^2.0.4
  file_picker: ^11.0.2
  flutter_slidable: ^4.0.3
  archive: ^4.0.9
  # image 仅被 pdf/image_network 间接依赖，这里显式给出上限：
  # image 4.11.x 的 png_decoder 调用了 archive 4.4.0 才提供的 ZLibDecoder.decodeLazy，
  # 但它自身只声明 archive ^4.0.9；而 pdf 3.12.0 把 archive 压在 <4.1.0 之内，
  # 因此"取最新"的解析必然落到 image 4.11.0 + archive 4.0.9 这个编译不过的组合。
  # 待 pdf(>=3.13.1)/xml(7.x)/Dart(>=3.11) 一并升级后再放开此上限。
  image: ">=4.8.0 <4.11.0"
  xml: ^6.5.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  qr_flutter: ^4.1.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 在 iOS 模拟器 / 真机上驱动真实 App 做端到端验收（自动点击、断言界面）
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.21.2
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  icons_launcher: ^3.0.0
  riverpod_generator: ^2.6.5
  sqflite_common_ffi: ^2.3.0
  # 数据库迁移测试需要直接构造"旧版本 schema"的 sqlite 文件
  sqlite3: ^2.9.4


dependency_overrides:
  logging: 1.3.0
  http: ^1.2.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add images to your application, add an images section, like this:
  assets:
    - pubspec.yaml
    - assets/images/
    - assets/images/scenes/
    - assets/images/wallpaper/
    # 底部导航栏等处的线性图标（Lucide 原版 SVG，24 网格 / 2px 圆头笔宽）。
    # 走资源而不是图标字体：Lucide 的 pub 包会连带 6 档字重、共 2.9MB 的 ttf
    # 一起进安装包——Flutter 的图标裁剪只处理代码里真正引用过的字体家族。
    - assets/images/nav/
    - assets/images/bridge/
    # 注意：资源目录声明**不递归**。声明 assets/images/ 只覆盖它**直接包含的文件**，
    # 任何子目录（不论第几层）都必须各自单独声明，否则整个目录会被静默跳过——
    # 代码报「Asset not found」而编译、静态检查、单元测试全都毫无提示。
    # 2026-10-14 新增 assets/images/monster/ 时实测确认：只加了 assets/images/，
    # 构建产物 build/flutter_assets/assets/images/ 下就是没有 monster 这一项。
    # 判断资源有没有进包，只能看构建产物（flutter build bundle 后查
    # build/flutter_assets/），不能只看源码里文件是否存在。
    - assets/images/pet/moods/
    # 用户宠物四态（背篓樱桃兽）：happy / sleepy / excited / sad
    - assets/images/pet/companion/
    - assets/images/pet/layers/
    - assets/privacy.html
    - assets/privacy_android.html
    - assets/protocol.html
    - assets/protocol_android.html
    - assets/audio/
    - assets/audio/scenes/
    - assets/audio/monster/
    - assets/video/
    - assets/video/scenes/
    - assets/fonts/
    # 音素词典（预编译紧凑查表格式），由 `dart run tool/phoneme/compile_cmudict.dart` 生成
    - assets/cmudict.pho
    - assets/db/initial.sqlite.gz
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding images from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 600
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 700
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 300
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 700
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 800
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 900
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 700
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages

# 插件说明： https://pub.dev/packages/flutter_native_splash
# dart run flutter_native_splash:create
# 原生闪屏页配置：logo + slogan 合成图
flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/splash_v2.png"
  android: true
  ios: true
  web: false

# 应用图标生成配置（使用 SVG 源图）
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png
    icon_size: 256
  # 注意：生成器不接受 SVG，需先导出 PNG
  image_path: assets/images/logo.png
  # fluwx 插件要求最低 SDK 版本为 24
  min_sdk_android: 24
  remove_alpha_ios: true

# 如改用 icons_launcher，可保留此段。但当前生成图标将使用 flutter_launcher_icons 与 PNG。
icons_launcher:
  image_path: assets/images/logo.png
  platforms:
    android:
      enable: false
    ios:
      enable: false
    windows:
      enable: false
