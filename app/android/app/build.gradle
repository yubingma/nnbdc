plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

// 如果环境变量存在，则覆盖 key.properties 中的值
if (System.getenv('KEYSTORE_PASSWORD')) {
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD')
}
if (System.getenv('KEY_PASSWORD')) {
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD')
}

// 根据环境选择 compileSdk 版本
// 优先使用 SDK 36（如果已安装），否则使用 SDK 35
def isCI = System.getenv("GITHUB_ACTIONS") == "true"
def sdkDir = localProperties.getProperty('sdk.dir') ?: System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
def sdk36Exists = sdkDir != null && new File(sdkDir, "platforms/android-36").exists()
def compileSdkVersion = (isCI || sdk36Exists) ? 36 : 35

android {
    namespace 'com.nn.nnbdc'
    compileSdk = compileSdkVersion
    ndkVersion = "26.3.11579264"
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        allWarningsAsErrors = false
        freeCompilerArgs += [
                "-Xjvm-default=all",
                "-Xno-deprecated-version-warning",
                "-Xsuppress-version-warnings",
                "-Xno-warn-on-deprecated-usage"
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.nn.nnbdc.android"
        // fluwx 插件要求最低 SDK 版本为 24
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            // 减少调试构建体积与安装时间
            shrinkResources false
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
        disable 'InvalidPackage'
        disable 'MissingPrefix'
        disable 'ImportError'
        ignore 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
