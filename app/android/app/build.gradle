plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

// 如果环境变量存在，则覆盖 key.properties 中的值
if (System.getenv('KEYSTORE_PASSWORD')) {
    keystoreProperties['storePassword'] = System.getenv('KEYSTORE_PASSWORD')
}
if (System.getenv('KEY_PASSWORD')) {
    keystoreProperties['keyPassword'] = System.getenv('KEY_PASSWORD')
}

// 根据环境选择 compileSdk 版本
// 优先使用 SDK 36（如果已安装），否则使用 SDK 35
def isCI = System.getenv("GITHUB_ACTIONS") == "true"
def sdkDir = localProperties.getProperty('sdk.dir') ?: System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
def sdk36Exists = sdkDir != null && new File(sdkDir, "platforms/android-36").exists()
def compileSdkVersion = (isCI || sdk36Exists) ? 36 : 35

android {
    namespace 'com.nn.nnbdc'
    compileSdk = compileSdkVersion
    // 升级到 NDK 27.0.12077973 以兼容所有 Flutter 插件
    ndkVersion = "27.0.12077973"
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        allWarningsAsErrors = false
        freeCompilerArgs += [
                "-Xjvm-default=all",
                "-Xno-deprecated-version-warning",
                "-Xsuppress-version-warnings",
                "-Xno-warn-on-deprecated-usage"
        ]
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs = ['libs/jniLibs']
    }

    defaultConfig {
        applicationId "com.nn.nnbdc.android"
        // fluwx 插件要求最低 SDK 版本为 24
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // 仅保留真机架构，移除 x86/x86_64 以及 armeabi-v7a (旧款手机)，可减小 APK 体积并避免不支持的 ABI 构建错误
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                // Disable optimizations that might need extra setup for now
                arguments "-DGGML_OPENMP=OFF", "-DGGML_CPU_KLEIDIAI=OFF"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1+" // use available version
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            // 减少调试构建体积与安装时间
            shrinkResources false
            minifyEnabled false
        }
    }

    lintOptions {
        abortOnError false
        disable 'InvalidPackage'
        disable 'MissingPrefix'
        disable 'ImportError'
        ignore 'InvalidPackage'
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // 与 Kotlin 插件版本保持一致
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.21"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    
    // 协程支持
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Google ML Kit Text Recognition
    implementation 'com.google.mlkit:text-recognition:16.0.0'
}
