org.gradle.jvmargs=-Xmx6144M -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=8
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
android.nonTransitiveRClass=true
android.nonFinalResIds=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=true
# 配置缓存：AGP 8.7.0 已支持，但可能仍有兼容性问题，先保持禁用
# 如果遇到配置缓存错误，可以尝试启用并设置为警告模式
# org.gradle.configuration-cache=true
# org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache=false
org.gradle.caching=true
# 启用文件系统监控以加速增量构建
org.gradle.vfs.watch=true
# 优化依赖解析性能
org.gradle.dependency.verification=off
# 启用构建缓存（即使配置缓存不可用，构建缓存仍可大幅提升速度）
org.gradle.buildcache.enabled=true
#systemProp.gradle.wrapperUrl=https://mirrors.aliyun.com/gradle/
#systemProp.http.proxyHost=127.0.0.1
#systemProp.http.proxyPort=1080
#systemProp.https.proxyHost=127.0.0.1
#systemProp.https.proxyPort=1080
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.https.protocols=TLSv1.2,TLSv1.3
# 已在上方统一配置，移除重复设置
systemProp.javax.net.ssl.trustStore=
systemProp.javax.net.ssl.trustStorePassword=

# Kotlin incremental build optimizations
kotlin.incremental=true
kotlin.incremental.java=true
# kotlin.incremental.useClasspathSnapshot=true  # 已弃用，移除
kotlin.caching.enabled=true
# 使用 daemon 模式以获得更好的性能（需要更多内存但更快）
kotlin.compiler.execution.strategy=daemon

# 设置默认的编译SDK版本
android.defaults.compileSdkVersion=36

flutter.compileSdkVersion=36
