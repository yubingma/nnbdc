def isCI = System.getenv("GITHUB_ACTIONS") == "true"

allprojects {
    repositories {
        if (isCI) {
            // CI 环境（GitHub Actions）：使用官方源，避免国内镜像 502/不稳定
            google()
            mavenCentral()
            maven { url 'https://storage.googleapis.com/download.flutter.io' }
            maven { url 'https://jitpack.io' }
            // 添加额外的 Maven 仓库以提高依赖解析成功率
            maven { url 'https://repo1.maven.org/maven2/' }
            maven { url 'https://maven.google.com' }
            maven { url 'https://repo.umeng.com/repository/sdk' }
        } else {
            // 本地/国内环境：优先使用国内镜像以提高下载速度
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
            maven { url 'https://jitpack.io' }
            maven { url 'https://storage.flutter-io.cn' }
            mavenCentral()
            // 添加额外的 Maven 仓库以提高依赖解析成功率
            maven { url 'https://repo1.maven.org/maven2/' }
            // 注意：这里刻意不放 google() / maven.google.com / repo.umeng.com。
            // 这三个源在部分网络下是不可达的（连接被黑洞，不是快速拒绝），
            // 一旦落到它们上面，Gradle 会一直卡在连接超时上，整条依赖解析挂住；
            // google 仓库已由上面的阿里云镜像完整代理，不需要再兜底。
            // 等哪天这些源恢复可达，可以再加回来。
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// 钉死第三方插件声明的动态版本依赖。
// 动态版本（"1.2+"、"3.3+"、"+"）必须联网问"有哪些可用版本"才能解析：网络不畅时整条依赖解析会挂在
// 连接超时上，而且构建结果不可复现。曾实测单次构建因此从 1.5 分钟恶化到 20 分钟。
//
// 来源一：Flutter SDK 的 integration_test 插件
//         (/Volumes/ssd/dev/flutter/packages/integration_test/android/build.gradle.kts:56-58)
//         api("androidx.test:runner:1.2+")、api("androidx.test:rules:1.2+")、
//         api("androidx.test.espresso:espresso-core:3.3+")
//         Flutter 官方在该文件 :51 自注 TODO 承认这三条不该进 release 构建（flutter/flutter#56591）。
// 来源二：umeng_common_sdk 插件 (android/build.gradle:40-41)
//         api 'com.umeng.umsdk:common:+'、api 'com.umeng.umsdk:asms:+'
//
// 一律钉死为本地已缓存、且当前实际生效的版本，既不改动构建产物，也不再触发任何联网查询。
def pinnedDynamicVersions = [
        'androidx.test:runner'                : '1.7.0',
        'androidx.test:rules'                 : '1.2.0',
        'androidx.test.espresso:espresso-core': '3.3.0',
        'com.umeng.umsdk:common'              : '10.0.1',
        'com.umeng.umsdk:asms'                : '1.8.7.2',
]
subprojects {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            def pinned = pinnedDynamicVersions["${details.requested.group}:${details.requested.name}"]
            if (pinned != null) {
                details.useVersion pinned
            }
        }
    }
}

// 为所有子项目配置 Kotlin 编译器选项，允许使用已弃用的 API
// 这主要是为了兼容第三方插件（如 fluwx）使用已弃用的 API
subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            // 允许使用已弃用的 API
            // 不将警告视为错误
            allWarningsAsErrors = false
            freeCompilerArgs += [
                "-Xno-deprecated-version-warning",
                "-Xsuppress-version-warnings",
                "-Xno-warn-on-deprecated-usage"
            ]
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
