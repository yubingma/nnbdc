server {
    listen 80;
    server_name nnbdc.com;
    
    # 重定向到 www
    return 301 http://www.nnbdc.com$request_uri;
}

server {
    listen 80;
    server_name www.nnbdc.com 47.108.27.205;
    
    location /canvaskit/ {
       root /usr/share/nginx/html/;
       expires 180d;
       add_header Cache-Control "public";
    }
    
    location /assets/assets/fonts/ {
       root /usr/share/nginx/html/;
       expires 180d;
       add_header Cache-Control "public";
    }
    
    # 后端 API 代理（利用前端 CDN 加速共享资源）
    # 词典资源接口需要真实下载进度（依赖 Content-Length）：
    # - 禁用 nginx gzip（避免二次压缩导致 Content-Length 丢失）
    # - 不强制 identity：允许客户端/后端协商 gzip，由后端负责压缩并返回 Content-Length
    location ~ ^/back/res/get(Sys|User)DictResById\.do$ {
       if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
          return 405;
       }
       gzip off;
       proxy_pass http://127.0.0.1:5200/;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_next_upstream off;
    }

    location /back/ {
       if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
          return 405;
       }
       proxy_pass http://127.0.0.1:5200/;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_next_upstream off;
    }
    
    location / {
       # CORS 统一由后端服务返回，避免 nginx 与后端重复/冲突导致跨域偶发问题
       root /usr/share/nginx/html/;
       index index.html;
    }
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
